name: Deploy all three paid MP4 scene controls (no generation)
on:
  # This workflow updates live paid-video infrastructure; run deliberately after validation.
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: afl-dev-deploy
  cancel-in-progress: false
jobs:
  enable-paid-scene-controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate three-scene contracts and CloudFormation
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'boto3>=1.35,<2' 'cfn-lint>=1,<2'
          python -m py_compile src/api/handler.py src/api/video_prompts.py src/google_video_worker/handler.py
          python -m unittest discover -s tests -p 'test_*.py' -v
          node --test tests/test_frontend_poll.cjs
          cfn-lint infrastructure/app/backend.yaml infrastructure/app/google-video.yaml --regions ap-southeast-2
          python - <<'PY'
          import json
          config=json.load(open('scenarios/afl-grand-final-winning-kick/v1/video/config.json'))
          assert config['videoGenerationEnabled'] is True
          assert 'videoConcurrency' not in config and config['maxPaidScenesPerRequest']==1
          assert [(s['id'],s['durationSeconds']) for s in config['scenes']] == [
              ('scene1',4),('scene2',8),('scene3',5)]
          print('Paid scene configuration validated. No video submitted.')
          PY
      - name: Verify Google diagnostics contracts before any AWS write
        run: |
          set -euo pipefail
          node --check frontend/app.js
          python - <<'PY'
          from pathlib import Path
          worker = Path('src/google_video_worker/handler.py').read_text()
          diag = worker.split('def diagnose_failed_interaction(job, scene):')[1].split('def lambda_handler(event, context):')[0]
          assert 'google_json("GET"' in diag
          assert 'google_json("POST"' not in diag
          assert 'read_stored_failure(record)' in diag
          assert 'GOOGLE_RESPONSE_TOO_LARGE' in diag
          assert 'GOOGLE_GET_HTTP_' in diag
          assert '"providerFinalStatus": state' in worker
          html = Path('frontend/index.html').read_text()
          assert '<script src="./app.js"></script>' in html
          assert '<link rel="stylesheet" href="./styles.css">' in html
          assert Path('frontend/styles.css').stat().st_size > 0
          print('Diagnostics contracts and separated frontend verified.')
          PY
      - name: Assume existing GitHub OIDC AWS deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
      - name: Require existing CloudFormation infrastructure
        run: |
          set -euo pipefail
          for stack in afl-app-dev-backend afl-app-dev-google-video afl-app-dev-frontend; do
            state=$(aws cloudformation describe-stacks --stack-name "$stack" --query 'Stacks[0].StackStatus' --output text)
            test "$state" = CREATE_COMPLETE -o "$state" = UPDATE_COMPLETE
          done
      - name: Block CloudFormation release if live Lambda code differs from recorded artifacts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import boto3

          cf = boto3.client("cloudformation", region_name="ap-southeast-2")
          lam = boto3.client("lambda", region_name="ap-southeast-2")
          s3 = boto3.client("s3", region_name="ap-southeast-2")
          targets = [
              ("afl-app-dev-google-video", "GoogleWorkerArtifactKey", "afl-app-dev-google-omni-worker"),
              ("afl-app-dev-backend", "LambdaArtifactKey", "afl-app-dev-api"),
          ]
          for stack_name, artifact_parameter, function_name in targets:
              stack = cf.describe_stacks(StackName=stack_name)["Stacks"][0]
              parameters = {p["ParameterKey"]: p["ParameterValue"] for p in stack["Parameters"]}
              bucket = parameters["ArtifactBucketName"]
              key = parameters[artifact_parameter]
              live = lam.get_function_configuration(FunctionName=function_name)
              if live.get("State") != "Active" or live.get("LastUpdateStatus") != "Successful":
                  raise RuntimeError(f"{function_name}: Lambda not ready; refusing deployment")
              try:
                  artifact = s3.get_object(Bucket=bucket, Key=key)["Body"].read()
              except Exception as exc:
                  raise RuntimeError(
                      f"{function_name}: cannot read CloudFormation artifact {key}; refusing deployment"
                  ) from exc
              recorded_sha = base64.b64encode(hashlib.sha256(artifact).digest()).decode("ascii")
              if live["CodeSha256"] != recorded_sha:
                  raise RuntimeError(
                      f"{function_name}: LIVE CODE DRIFT detected against {stack_name} "
                      f"artifact {key}. Refusing to overwrite working Lambda. "
                      "Reconcile live code and CloudFormation before releasing."
                  )
              print(f"{function_name}: live Lambda package matches CloudFormation artifact")
          PY
      - name: Package Python 3.13 native Google adapter
        run: |
          set -euo pipefail
          mkdir -p dist/google-paid
          python -m pip install --disable-pip-version-check \
            --platform manylinux2014_x86_64 --python-version 3.13 \
            --implementation cp --abi cp313 --only-binary=:all: \
            --target dist/google-paid 'google-auth[requests]>=2.30,<3'
          python - <<'PY'
          from pathlib import Path
          p=Path('dist/google-paid')
          assert list(p.glob('_cffi_backend*.so'))
          assert list(p.glob('cryptography/hazmat/bindings/_rust*.so'))
          PY
          cp src/google_video_worker/handler.py src/api/video_prompts.py dist/google-paid/
          (cd dist/google-paid && zip -q -r ../google-paid.zip .)
          aws s3 cp dist/google-paid.zip "s3://afl-video-bootstrap-artifactbucket-xiuriidgyft4/google-video/$GITHUB_SHA.zip"
      - name: Deploy Google worker with per-job approval required
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks --stack-name afl-app-dev-google-video --output json > /tmp/google-stack.json
          mapfile -t overrides < <(jq -r '.Stacks[0].Parameters[] | select(.ParameterValue != null) | select(.ParameterKey != "GoogleWorkerArtifactKey") | select(.ParameterKey != "PaidVideoEnabled") | "\(.ParameterKey)=\(.ParameterValue)"' /tmp/google-stack.json)
          overrides+=("GoogleWorkerArtifactKey=google-video/$GITHUB_SHA.zip" "PaidVideoEnabled=true")
          aws cloudformation deploy \
            --stack-name afl-app-dev-google-video \
            --region ap-southeast-2 \
            --template-file infrastructure/app/google-video.yaml \
            --parameter-overrides "${overrides[@]}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn arn:aws:iam::134387458447:role/afl-video-cfn-execution-role \
            --no-fail-on-empty-changeset
          test "$(aws cloudformation describe-stacks --stack-name afl-app-dev-google-video --query 'Stacks[0].Outputs[?OutputKey==`PaidGenerationMode`].OutputValue | [0]' --output text)" = ENABLED
          aws lambda invoke --function-name afl-app-dev-google-omni-worker \
            --cli-binary-format raw-in-base64-out --payload '{"op":"contract_health"}' \
            /tmp/health.json > /tmp/health-meta.json
          python - <<'PY'
          import json
          result=json.load(open('/tmp/health.json'))
          meta=json.load(open('/tmp/health-meta.json'))
          assert not meta.get('FunctionError'), 'Google worker Lambda failure'
          assert result.get('status')=='CONFIGURED'
          assert result.get('model')=='gemini-omni-1.2-flash'
          print('Google worker configured; NO model generation requested.')
          PY
      - name: Check real Google WIF authentication without generating video
        run: |
          set -euo pipefail
          aws lambda invoke --function-name afl-app-dev-google-omni-worker \
            --cli-binary-format raw-in-base64-out --payload '{"op":"auth_check"}' \
            /tmp/auth-video.json > /tmp/auth-video-meta.json
          python - <<'PY'
          import json
          result=json.load(open('/tmp/auth-video.json'))
          meta=json.load(open('/tmp/auth-video-meta.json'))
          if meta.get('FunctionError') or result.get('status')!='AUTHENTICATED':
              print('Google model generation has NOT been attempted.')
              print('Safe auth diagnostic:', result.get('errorCode', 'UNAVAILABLE'))
              raise SystemExit('Google WIF is not ready; fail deployment before enabling new API')
          print('Google WIF authenticated. No paid model request was made.')
          PY
      - name: Publish and verify all four S3 video prompt assets (no paid calls)
        run: |
          set -euo pipefail
          bucket=$(aws cloudformation describe-stacks --stack-name afl-app-dev-google-video \
            --query 'Stacks[0].Parameters[?ParameterKey==`ScenarioAssetBucketName`].ParameterValue | [0]' --output text)
          test -n "$bucket" && test "$bucket" != None
          prefix=scenarios/afl-grand-final-winning-kick/v1/video
          for file in config.json scene1-video.txt scene2-video.txt scene3-video.txt; do
            local_path="$prefix/$file"
            key="$prefix/$file"
            case "$file" in
              config.json) content_type=application/json ;;
              *) content_type='text/plain; charset=utf-8' ;;
            esac
            aws s3 cp "$local_path" "s3://$bucket/$key" --content-type "$content_type"
            aws s3api head-object --bucket "$bucket" --key "$key" > /dev/null
            aws s3api get-object --bucket "$bucket" --key "$key" "/tmp/afl-verified-$file" > /dev/null
            cmp "$local_path" "/tmp/afl-verified-$file"
            echo "Verified S3 content: $key"
          done
      - name: Package current API and deploy paid-approval gateway
        run: |
          set -euo pipefail
          mkdir -p dist/api-paid
          cp src/api/handler.py src/api/video_prompts.py dist/api-paid/
          (cd dist/api-paid && zip -q ../api-paid.zip handler.py video_prompts.py)
          aws s3 cp dist/api-paid.zip "s3://afl-video-bootstrap-artifactbucket-xiuriidgyft4/api/$GITHUB_SHA.zip"
          aws cloudformation describe-stacks --stack-name afl-app-dev-backend --output json > /tmp/backend-stack.json
          mapfile -t overrides < <(jq -r '.Stacks[0].Parameters[] | select(.ParameterValue != null) | select(.ParameterKey != "LambdaArtifactKey") | select(.ParameterKey != "PaidVideoEnabled") | "\(.ParameterKey)=\(.ParameterValue)"' /tmp/backend-stack.json)
          overrides+=("LambdaArtifactKey=api/$GITHUB_SHA.zip" "PaidVideoEnabled=true")
          aws cloudformation deploy \
            --stack-name afl-app-dev-backend \
            --region ap-southeast-2 \
            --template-file infrastructure/app/backend.yaml \
            --parameter-overrides "${overrides[@]}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn arn:aws:iam::134387458447:role/afl-video-cfn-execution-role \
            --no-fail-on-empty-changeset
          test "$(aws cloudformation describe-stacks --stack-name afl-app-dev-backend --query 'Stacks[0].StackStatus' --output text)" = UPDATE_COMPLETE
      - name: Publish UI showing independent paid scene buttons
        run: |
          set -euo pipefail
          bucket=$(aws cloudformation describe-stacks --stack-name afl-app-dev-frontend --query 'Stacks[0].Outputs[?OutputKey==`FrontendBucketName`].OutputValue | [0]' --output text)
          distribution=$(aws cloudformation describe-stacks --stack-name afl-app-dev-frontend --query 'Stacks[0].Outputs[?OutputKey==`DistributionId`].OutputValue | [0]' --output text)
          test -n "$bucket" && test "$bucket" != None
          test -n "$distribution" && test "$distribution" != None
          aws s3 cp frontend/styles.css "s3://$bucket/styles.css" \
            --content-type 'text/css; charset=utf-8' --cache-control 'max-age=60, must-revalidate'
          aws s3 cp frontend/app.js "s3://$bucket/app.js" \
            --content-type 'application/javascript; charset=utf-8' --cache-control 'max-age=60, must-revalidate'
          aws s3 cp frontend/index.html "s3://$bucket/index.html" \
            --content-type 'text/html; charset=utf-8' --cache-control 'max-age=60, must-revalidate'
          aws cloudfront create-invalidation --distribution-id "$distribution" --paths /index.html /styles.css /app.js /
          echo 'Three individual paid scene buttons enabled; no paid MP4 has been triggered.'
