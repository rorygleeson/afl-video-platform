<rect x="103" y="300" width="282" height="36" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="116" y="323" font-size="14" fill="#64748b">First name · Surname</text>
<rect x="103" y="353" width="282" height="37" rx="8" fill="#e2e8f0" stroke="#cbd5e1"/>
<text x="116" y="377" font-size="14" fill="#334155">Choose a selfie</text>
<rect x="103" y="404" width="282" height="37" rx="8" fill="#17689b"/>
<text x="244" y="427" font-size="15" fill="#fff" text-anchor="middle" font-weight="bold">Create reference images</text>
<rect x="660" y="108" width="350" height="362" rx="29" fill="#172432"/>
<rect x="670" y="119" width="330" height="338" rx="19" fill="#fff"/>
<rect x="800" y="124" width="70" height="8" rx="4" fill="#cbd5e1"/>
<text x="693" y="162" font-size="23" font-weight="bold" fill="#172432">Reference Images</text>
<text x="693" y="186" font-size="14" fill="#64748b">2. Review 3 personalised scenes</text>
<g transform="translate(693 203)">
<rect width="86" height="105" rx="9" fill="#e2e8f0"/>
<circle cx="43" cy="32" r="15" fill="#94a3b8"/>
<path d="M15 89 Q15 52 43 53 Q71 52 71 89" fill="#94a3b8"/>
