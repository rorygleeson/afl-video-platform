{jobId}13" y="979" font-size="14.5" fill="#536B79">Starts named watch-{jobId}</text><text x="Checks 1 job each 60 seconds13" y="1000" font-size="14.5" fill="#536B79">Checks 1 job each 60 seconds</text><text x="No idle video watchdog cron13" y="1021" font-size="14.5" fill="#536B79">No idle video watchdog cron</text><rect x="640" y="925" width="510" height="118" rx="13" fill="#EFF8F2" stroke="#86BCA3" stroke-width="2"/><text x="653" y="953" fill="#243E52" font-size="18" font-weight="700">Verified event replay only</text><text x="No direct Google POST or DDB writes13" y="979" font-size="14.5" fill="#536B79">No direct Google POST or DDB writes</text><text x="DynamoDB + DescribeExecution13" y="1000" font-size="14.5" fill="#536B79">DynamoDB + DescribeExecution</text><text x="API still revalidates S3 and owner13" y="1021" font-size="14.5" fill="#536B79">API still revalidates S3 and owner</text><rect x="1225" y="925" width="500" height="118" rx="13" fill="#FFF0EF" stroke="#C98983" stroke-width="2"/><text x="1238" y="953" fill="#243E52" font-size="18" font-weight="700">Unresolved coverage gap</text><text x="Missed initial RUNNING event13" y="979" font-size="14.5" fill="#536B79">Missed initial RUNNING event</text><text x="2-hour maximum and review exits13" y="1000" font-size="14.5" fill="#536B79">2-hour maximum and review exits</text><text x="No guaranteed durable alert/queue13" y="1021" font-size="14.5" fill="#536B79">No guaranteed durable alert/queue</text><path d="M565 982L635 982" stroke="#536F83" stroke-width="2.3"  fill="none" marker-end="url(#tri)"/><path d="M1150 982L1220 982" stroke="#B67437" stroke-width="2.3" stroke-dasharray="6 5" fill="none" marker-end="url(#triWarn)"/><text x="1185" y="973" fill="#51697A" text-anchor="middle" font-size="13">risk</text><rect x="42" y="1090" width="1695" height="140" rx="12" fill="#F5F7F9" stroke="#D7E0E6"/><text x="65" y="1123" font-size="19" font-weight="700" fill="#2B4557">Delivery semantics: EventBridge events and Step Functions outcomes are NOT the same thing.</text><text x="65" y="1151" font-size="16" fill="#4D6577">SUCCESS notification = trigger to verify, not proof all downstream data or next execution is ready.</text><text x="65" y="1177" font-size="16" fill="#4D6577">DDB reservation and named execution are separate checkpoints; unknown paid Google acceptance remains nonterminal.</text><text x="65" y="1203" font-size="16" fill="#4D6577">Operational risk: EventBridge rules configure retries but no DLQ; live IAM/state-machine drift not yet re-verified.</text></g></svg>