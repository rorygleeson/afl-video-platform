<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="1050" viewBox="0 0 1510 1050" role="img" aria-label="EventBridge handoffs | what actually starts the next stage"><defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#47657B"/></marker>
 <marker id="warning" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#BA6D45"/></marker></defs><rect width="1510" height="1050" fill="#FAFBFC"/><g font-family="Arial,Helvetica,sans-serif">
 <text x="48" y="54" font-size="31" font-weight="700" fill="#153148">EventBridge handoffs | what actually starts the next stage</text><text x="48" y="83" font-size="16" fill="#567082">Three completion notifications + independent watchdog start; each arrow is checked against state and S3</text><text x="48" y="119" font-size="17" font-weight="700" fill="#60798B">SOURCE CHECKPOINT                       EVENT RULE                            API / WATCHDOG VERIFICATION                 CONSEQUENCE</text><line x1="48" y1="131" x2="1462" y2="131" stroke="#D9E2E9" stroke-width="1.5"/><rect x="54" y="153" width="303" height="104" rx="12" fill="#E6F4EB" stroke="#83B599" stroke-width="1.8"/><text x="69" y="182" font-size="19" fill="#193D55" font-weight="700">Image SFN SUCCEEDED</text><text x="69" y="207" font-size="15" fill="#405B6E">3 reference images final</text><rect x="433" y="153" width="303" height="104" rx="12" fill="#E7F1FA" stroke="#779DBA" stroke-width="1.8"/><text x="448" y="182" font-size="19" fill="#193D55" font-weight="700">Image completion rule</text><text x="448" y="207" font-size="15" fill="#405B6E">aws.states → API Lambda</text><rect x="816" y="153" width="303" height="104" rx="12" fill="#F0EBF9" stroke="#AD98CE" stroke-width="1.8"/><text x="831" y="182" font-size="19" fill="#193D55" font-weight="700">image_sequence_event</text><text x="831" y="207" font-size="15" fill="#405B6E">Consent + 3 scene states</text><rect x="1199" y="153" width="256" height="104" rx="12" fill="#FFF3E1" stroke="#D3AA71" stroke-width="1.8"/><text x="1214" y="182" font-size="19" fill="#193D55" font-weight="700">Reserve &amp; start Video 1</text><text x="1214" y="207" font-size="15" fill="#405B6E">DDB claim + named SFN</text><path d="M357 205 L428 205" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M736 205 L811 205" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M1119 205 L1194 205" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="54" y="327" width="303" height="104" rx="12" fill="#E6F4EB" stroke="#83B599" stroke-width="1.8"/><text x="69" y="356" font-size="19" fill="#193D55" font-weight="700">Video 1 SFN SUCCEEDED</text><text x="69" y="381" font-size="15" fill="#405B6E">Scene 1 MP4 completed</text><rect x="433" y="327" width="303" height="104" rx="12" fill="#E7F1FA" stroke="#779DBA" stroke-width="1.8"/><text x="448" y="356" font-size="19" fill="#193D55" font-weight="700">Video completion rule</text><text x="448" y="381" font-size="15" fill="#405B6E">aws.states → API Lambda</text><rect x="816" y="327" width="303" height="104" rx="12" fill="#F0EBF9" stroke="#AD98CE" stroke-width="1.8"/><text x="831" y="356" font-size="19" fill="#193D55" font-weight="700">video_sequence_event</text><text x="831" y="381" font-size="15" fill="#405B6E">Attempt owner + S3 HEAD</text><rect x="1199" y="327" width="256" height="104" rx="12" fill="#FFF3E1" stroke="#D3AA71" stroke-width="1.8"/><text x="1214" y="356" font-size="19" fill="#193D55" font-weight="700">Reserve &amp; start Video 2</text><text x="1214" y="381" font-size="15" fill="#405B6E">No fixed timing wait</text><path d="M357 379 L428 379" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M736 379 L811 379" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M1119 379 L1194 379" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="54" y="501" width="303" height="104" rx="12" fill="#E6F4EB" stroke="#83B599" stroke-width="1.8"/><text x="69" y="530" font-size="19" fill="#193D55" font-weight="700">Video 2 SFN SUCCEEDED</text><text x="69" y="555" font-size="15" fill="#405B6E">Scene 2 MP4 completed</text><rect x="433" y="501" width="303" height="104" rx="12" fill="#E7F1FA" stroke="#779DBA" stroke-width="1.8"/><text x="448" y="530" font-size="19" fill="#193D55" font-weight="700">Same video event rule</text><text x="448" y="555" font-size="15" fill="#405B6E">aws.states → API Lambda</text><rect x="816" y="501" width="303" height="104" rx="12" fill="#F0EBF9" stroke="#AD98CE" stroke-width="1.8"/><text x="831" y="530" font-size="19" fill="#193D55" font-weight="700">video_sequence_event</text><text x="831" y="555" font-size="15" fill="#405B6E">Attempt owner + S3 HEAD</text><rect x="1199" y="501" width="256" height="104" rx="12" fill="#FFF3E1" stroke="#D3AA71" stroke-width="1.8"/><text x="1214" y="530" font-size="19" fill="#193D55" font-weight="700">Reserve &amp; start Video 3</text><text x="1214" y="555" font-size="15" fill="#405B6E">No fixed timing wait</text><path d="M357 553 L428 553" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M736 553 L811 553" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M1119 553 L1194 553" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="54" y="675" width="303" height="104" rx="12" fill="#E6F4EB" stroke="#83B599" stroke-width="1.8"/><text x="69" y="704" font-size="19" fill="#193D55" font-weight="700">Video 3 SFN SUCCEEDED</text><text x="69" y="729" font-size="15" fill="#405B6E">Scene 3 MP4 completed</text><rect x="433" y="675" width="303" height="104" rx="12" fill="#E7F1FA" stroke="#779DBA" stroke-width="1.8"/><text x="448" y="704" font-size="19" fill="#193D55" font-weight="700">Same video event rule</text><text x="448" y="729" font-size="15" fill="#405B6E">aws.states → API Lambda</text><rect x="816" y="675" width="303" height="104" rx="12" fill="#F0EBF9" stroke="#AD98CE" stroke-width="1.8"/><text x="831" y="704" font-size="19" fill="#193D55" font-weight="700">video_sequence_event</text><text x="831" y="729" font-size="15" fill="#405B6E">S3 HEAD + all three MP4s</text><rect x="1199" y="675" width="256" height="104" rx="12" fill="#FFF3E1" stroke="#D3AA71" stroke-width="1.8"/><text x="1214" y="704" font-size="19" fill="#193D55" font-weight="700">Reserve final assembly</text><text x="1214" y="729" font-size="15" fill="#405B6E">Named final-{jobId} SFN</text><path d="M357 727 L428 727" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M736 727 L811 727" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M1119 727 L1194 727" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><rect x="54" y="820" width="1400" height="76" rx="10" fill="#FFFFFF" stroke="#C5D3DE"/><text x="68" y="846" font-size="15" fill="#456075">Separate watchdog: image SFN RUNNING event → watch-{jobId} → check every 60s, replay only verified old successes.</text><text x="68" y="869" font-size="15" fill="#456075">Missing watchdog start, a stopped watcher or the 2-hour cap can leave a handoff unresolved.</text><rect x="54" y="928" width="1400" height="76" rx="10" fill="#FFFFFF" stroke="#C5D3DE"/><text x="68" y="954" font-size="15" fill="#456075">Repeated event: same DDB reservation and named execution prevent another paid start. Reserved job without SFN → NEEDS_REVIEW.</text><text x="68" y="977" font-size="15" fill="#456075">Successful Lambda invocation with NEEDS_REVIEW is not a Lambda error; no guaranteed automatic application-level retry.</text></g></svg>