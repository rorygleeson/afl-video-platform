<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="630" viewBox="0 0 1240 630" role="img" aria-label="Event-driven AFL per-job watchdog architecture and safeguards">
<defs><marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8Z" fill="#56758c"/></marker></defs>
<rect width="1240" height="630" fill="#fff"/><text x="42" y="48" font-family="Arial" font-size="27" font-weight="700" fill="#172b41">AFL Video — per-job handoff watchdog</text><text x="42" y="75" font-family="Arial" font-size="16" fill="#50657a">Source verified 16 Nov 2026  ·  60-second check cadence  ·  no idle watchdog schedule</text>
<g font-family="Arial" text-anchor="middle">
<rect x="35" y="130" width="240" height="125" rx="14" fill="#ebf5ff" stroke="#2c6f9d" stroke-width="2"/><text x="155" y="165" font-size="19" font-weight="700" fill="#19364f">Image workflow</text><text x="155" y="193" font-size="15" fill="#315169">Step Functions RUNNING</text><text x="155" y="216" font-size="15" fill="#315169">on consented job</text>
<rect x="350" y="130" width="240" height="125" rx="14" fill="#ebf5ff" stroke="#2c6f9d" stroke-width="2"/><text x="470" y="165" font-size="19" font-weight="700" fill="#19364f">EventBridge</text><text x="470" y="192" font-size="15" fill="#315169">image-start event rule</text><text x="470" y="217" font-size="15" fill="#315169">not a cron</text>
<rect x="665" y="130" width="240" height="125" rx="14" fill="#eaf8f0" stroke="#328461" stroke-width="2"/><text x="785" y="165" font-size="19" font-weight="700" fill="#19364f">Watchdog Lambda</text><text x="785" y="192" font-size="15" fill="#315169">validate job + consent</text><text x="785" y="217" font-size="15" fill="#315169">start watch-{jobId}</text>
<rect x="970" y="130" width="230" height="125" rx="14" fill="#eaf8f0" stroke="#328461" stroke-width="2"/><text x="1085" y="165" font-size="19" font-weight="700" fill="#19364f">Watchdog SFN</text><text x="1085" y="193" font-size="15" fill="#315169">Wait 60s → check → repeat</text><text x="1085" y="218" font-size="15" fill="#315169">max 2 hours</text>
</g>
<g fill="none" stroke="#56758c" stroke-width="3" marker-end="url(#arr)"><path d="M275 192 H345"/><path d="M590 192 H660"/><path d="M905 192 H965"/><path d="M1085 260 V325 H780 V355"/></g>
<rect x="595" y="355" width="370" height="132" rx="15" fill="#f1f4ff" stroke="#656cb0" stroke-width="2"/><text x="780" y="384" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#243450">One-job safety check</text><text x="780" y="413" text-anchor="middle" font-family="Arial" font-size="15" fill="#334860">DynamoDB GetItem + DescribeExecution</text><text x="780" y="439" text-anchor="middle" font-family="Arial" font-size="15" fill="#334860">Replay only SUCCEEDED &amp; ≥120s old</text><text x="780" y="465" text-anchor="middle" font-family="Arial" font-size="15" fill="#334860">Existing API enforces idempotency</text>
<rect x="55" y="365" width="435" height="114" rx="15" fill="#fff8ec" stroke="#bf8843" stroke-width="2"/><text x="77" y="396" font-family="Arial" font-size="20" font-weight="700" fill="#5d4324">Separate existing image reconciler</text><text x="77" y="425" font-family="Arial" font-size="16" fill="#655338">Scheduled every 5 minutes, even when idle</text><text x="77" y="451" font-family="Arial" font-size="16" fill="#655338">~45-minute stalled image threshold</text>
<rect x="55" y="524" width="1145" height="68" rx="12" fill="#f5f7f9" stroke="#d0dbe3"/><text x="76" y="550" font-family="Arial" font-size="17" font-weight="700" fill="#21374b">Safety:</text><text x="145" y="550" font-family="Arial" font-size="16" fill="#334b60">No provider POSTs, no duplicate paid retry, no restart of in-flight work.</text><text x="76" y="577" font-family="Arial" font-size="15" fill="#526476">Caveats: lost start event, reserved assembly and unknown provider submissions still require additional recovery.</text>
</svg>