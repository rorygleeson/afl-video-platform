<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="1085" viewBox="0 0 1510 1085" role="img" aria-label="Retries and failure boundaries | per operation"><defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#47657B"/></marker>
 <marker id="warning" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#BA6D45"/></marker></defs><rect width="1510" height="1085" fill="#FAFBFC"/><g font-family="Arial,Helvetica,sans-serif">
 <text x="48" y="54" font-size="31" font-weight="700" fill="#153148">Retries and failure boundaries | per operation</text><text x="48" y="83" font-size="16" fill="#567082">Different failures have different owners; a Google video POST is never blindly reissued</text><text x="48" y="120" font-size="17" font-weight="700" fill="#60798B">OPERATION                                  SAFE RETRY                                      UNSAFE / TERMINAL CASE</text><line x1="48" y1="132" x2="1462" y2="132" stroke="#D9E2E9" stroke-width="1.5"/><rect x="54" y="157" width="354" height="111" rx="12" fill="#E7F1FA" stroke="#779DBA" stroke-width="1.8"/><text x="69" y="186" font-size="19" fill="#193D55" font-weight="700">Reference image POST</text><text x="69" y="211" font-size="15" fill="#405B6E">Google direct image API</text><rect x="506" y="157" width="407" height="111" rx="12" fill="#E6F4EB" stroke="#83B599" stroke-width="1.8"/><text x="521" y="186" font-size="19" fill="#193D55" font-weight="700">Confirmed HTTP 429 only</text><text x="521" y="211" font-size="15" fill="#405B6E">Up to 8 attempts / 600s</text><rect x="1011" y="157" width="442" height="111" rx="12" fill="#FCEBE7" stroke="#CA8B7D" stroke-width="1.8"/><text x="1026" y="186" font-size="19" fill="#193D55" font-weight="700">Unknown response or timeout</text><text x="1026" y="211" font-size="15" fill="#405B6E">No automatic resubmit</text><path d="M408 212 L501 212" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M913 212 L1006 212" fill="none" stroke="#BA6D45" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#warning)"/><text x="919" y="203" font-size="14" fill="#536A7D">else</text><rect x="54" y="331" width="354" height="111" rx="12" fill="#E7F1FA" stroke="#779DBA" stroke-width="1.8"/><text x="69" y="360" font-size="19" fill="#193D55" font-weight="700">Google video POST</text><text x="69" y="385" font-size="15" fill="#405B6E">Persist SUBMISSION_UNKNOWN first</text><rect x="506" y="331" width="407" height="111" rx="12" fill="#E6F4EB" stroke="#83B599" stroke-width="1.8"/><text x="521" y="360" font-size="19" fill="#193D55" font-weight="700">No automatic Submit retry</text><text x="521" y="385" font-size="15" fill="#405B6E">One POST per approved attempt</text><rect x="1011" y="331" width="442" height="111" rx="12" fill="#FCEBE7" stroke="#CA8B7D" stroke-width="1.8"/><text x="1026" y="360" font-size="19" fill="#193D55" font-weight="700">Lost response / interaction ID</text><text x="1026" y="385" font-size="15" fill="#405B6E">Review; do not issue a second POST</text><path d="M408 386 L501 386" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M913 386 L1006 386" fill="none" stroke="#BA6D45" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#warning)"/><text x="919" y="377" font-size="14" fill="#536A7D">else</text><rect x="54" y="505" width="354" height="111" rx="12" fill="#E7F1FA" stroke="#779DBA" stroke-width="1.8"/><text x="69" y="534" font-size="19" fill="#193D55" font-weight="700">Google interaction GET</text><text x="69" y="559" font-size="15" fill="#405B6E">20-second WaitForVideo cadence</text><rect x="506" y="505" width="407" height="111" rx="12" fill="#E6F4EB" stroke="#83B599" stroke-width="1.8"/><text x="521" y="534" font-size="19" fill="#193D55" font-weight="700">Read-only PollVideo retry</text><text x="521" y="559" font-size="15" fill="#405B6E">Up to 3 GET task retries</text><rect x="1011" y="505" width="442" height="111" rx="12" fill="#FCEBE7" stroke="#CA8B7D" stroke-width="1.8"/><text x="1026" y="534" font-size="19" fill="#193D55" font-weight="700">Confirmed provider failure</text><text x="1026" y="559" font-size="15" fill="#405B6E">Manual scene retry only, max 10</text><path d="M408 560 L501 560" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M913 560 L1006 560" fill="none" stroke="#BA6D45" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#warning)"/><text x="919" y="551" font-size="14" fill="#536A7D">else</text><rect x="54" y="679" width="354" height="111" rx="12" fill="#E7F1FA" stroke="#779DBA" stroke-width="1.8"/><text x="69" y="708" font-size="19" fill="#193D55" font-weight="700">FFmpeg stitch task</text><text x="69" y="733" font-size="15" fill="#405B6E">One named final SFN</text><rect x="506" y="679" width="407" height="111" rx="12" fill="#E6F4EB" stroke="#83B599" stroke-width="1.8"/><text x="521" y="708" font-size="19" fill="#193D55" font-weight="700">First confirmed worker FAILED</text><text x="521" y="733" font-size="15" fill="#405B6E">Wait 15s, retry FFmpeg once</text><rect x="1011" y="679" width="442" height="111" rx="12" fill="#FCEBE7" stroke="#CA8B7D" stroke-width="1.8"/><text x="1026" y="708" font-size="19" fill="#193D55" font-weight="700">Uncertain timeout → review</text><text x="1026" y="733" font-size="15" fill="#405B6E">2nd confirmed FAILED → terminal</text><path d="M408 734 L501 734" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M913 734 L1006 734" fill="none" stroke="#BA6D45" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#warning)"/><text x="919" y="725" font-size="14" fill="#536A7D">else</text><rect x="54" y="853" width="354" height="111" rx="12" fill="#E7F1FA" stroke="#779DBA" stroke-width="1.8"/><text x="69" y="882" font-size="19" fill="#193D55" font-weight="700">Event handoff / watchdog</text><text x="69" y="907" font-size="15" fill="#405B6E">Stateful DDB / SFN ownership</text><rect x="506" y="853" width="407" height="111" rx="12" fill="#E6F4EB" stroke="#83B599" stroke-width="1.8"/><text x="521" y="882" font-size="19" fill="#193D55" font-weight="700">Verified old SUCCEEDED event</text><text x="521" y="907" font-size="15" fill="#405B6E">Watchdog checks once per 60s</text><rect x="1011" y="853" width="442" height="111" rx="12" fill="#FCEBE7" stroke="#CA8B7D" stroke-width="1.8"/><text x="1026" y="882" font-size="19" fill="#193D55" font-weight="700">Missing event, no watcher, &gt;2h</text><text x="1026" y="907" font-size="15" fill="#405B6E">Operator review / alert needed</text><path d="M408 908 L501 908" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M913 908 L1006 908" fill="none" stroke="#BA6D45" stroke-width="2.4" stroke-dasharray="6 5" marker-end="url(#warning)"/><text x="919" y="899" font-size="14" fill="#536A7D">else</text><rect x="54" y="1000" width="1400" height="76" rx="10" fill="#FFFFFF" stroke="#C5D3DE"/><text x="68" y="1026" font-size="15" fill="#456075">Permanent customer failure only after confirmed evidence: content blocked, image terminal, exhausted video attempts or exhausted FFmpeg.</text><text x="68" y="1049" font-size="15" fill="#456075">REVIEW_REQUIRED means uncertain, not failed or refundable. No payment/refund order system implemented.</text></g></svg>