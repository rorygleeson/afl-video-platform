<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1110" viewBox="0 0 1500 1110" role="img" aria-label="GENERATION, RETRIES AND TERMINAL OUTCOMES. Backend-owned sequencing  ·  No automatic retry of ambiguous paid Google video POST"><defs><marker id="arr" markerWidth="11" markerHeight="9" refX="10" refY="4.5" orient="auto"><path d="M0 0L11 4.5L0 9Z" fill="#58778A"/></marker></defs><rect width="1500" height="1110" fill="#fff"/><g font-family="Arial, Helvetica, sans-serif"><text x="56" y="51" font-size="30" font-weight="700" fill="#172D43">GENERATION, RETRIES AND TERMINAL OUTCOMES</text><text x="56" y="80" font-size="16" fill="#587080">Backend-owned sequencing  ·  No automatic retry of ambiguous paid Google video POST</text><rect x="40" y="112" width="1420" height="188" rx="19" fill="#EDF9F2" stroke="#A9CEB9" stroke-width="1.7"/><text x="68" y="146" font-size="22" font-weight="700" fill="#263F54">A   IMAGE CREATION AND ACCEPTANCE</text><rect x="75" y="168" width="422" height="102" rx="12" fill="#fff" stroke="#A9CEB9" stroke-width="2"/><text x="286" y="203" font-size="19" font-weight="700" text-anchor="middle" fill="#1F3A4D">Three image branches</text><text x="286" y="232" font-size="15" text-anchor="middle" fill="#52697A">Concurrent Map x3</text><path d="M502 219H531" stroke="#58778A" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="539" y="168" width="422" height="102" rx="12" fill="#fff" stroke="#A9CEB9" stroke-width="2"/><text x="750" y="203" font-size="19" font-weight="700" text-anchor="middle" fill="#1F3A4D">Explicit Google 429</text><text x="750" y="232" font-size="15" text-anchor="middle" fill="#52697A">Up to 8 attempts / 600s</text><path d="M966 219H995" stroke="#58778A" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="1003" y="168" width="422" height="102" rx="12" fill="#fff" stroke="#A9CEB9" stroke-width="2"/><text x="1214" y="203" font-size="19" font-weight="700" text-anchor="middle" fill="#1F3A4D">Other ambiguous POST</text><text x="1214" y="232" font-size="15" text-anchor="middle" fill="#52697A">Stop / review; no replay</text><path d="M750 301V328" stroke="#58778A" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="40" y="332" width="1420" height="188" rx="19" fill="#F6F0FC" stroke="#C5B0DA" stroke-width="1.7"/><text x="68" y="366" font-size="22" font-weight="700" fill="#263F54">B   SCENE 1 → 2 → 3</text><rect x="75" y="388" width="422" height="102" rx="12" fill="#fff" stroke="#C5B0DA" stroke-width="2"/><text x="286" y="423" font-size="19" font-weight="700" text-anchor="middle" fill="#1F3A4D">Google Submit</text><text x="286" y="452" font-size="15" text-anchor="middle" fill="#52697A">One POST per approval</text><path d="M502 439H531" stroke="#58778A" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="539" y="388" width="422" height="102" rx="12" fill="#fff" stroke="#C5B0DA" stroke-width="2"/><text x="750" y="423" font-size="19" font-weight="700" text-anchor="middle" fill="#1F3A4D">PollVideo every 20s</text><text x="750" y="452" font-size="15" text-anchor="middle" fill="#52697A">Read-only GET retries</text><path d="M966 439H995" stroke="#58778A" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="1003" y="388" width="422" height="102" rx="12" fill="#fff" stroke="#C5B0DA" stroke-width="2"/><text x="1214" y="423" font-size="19" font-weight="700" text-anchor="middle" fill="#1F3A4D">Verified MP4 → event</text><text x="1214" y="452" font-size="15" text-anchor="middle" fill="#52697A">Next scene, no fixed wait</text><path d="M750 521V548" stroke="#58778A" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="40" y="552" width="1420" height="188" rx="19" fill="#EFF6FE" stroke="#9EBED8" stroke-width="1.7"/><text x="68" y="586" font-size="22" font-weight="700" fill="#263F54">C   FAILURE CONTROL</text><rect x="75" y="608" width="422" height="102" rx="12" fill="#fff" stroke="#9EBED8" stroke-width="2"/><text x="286" y="643" font-size="19" font-weight="700" text-anchor="middle" fill="#1F3A4D">Confirmed scene failure</text><text x="286" y="672" font-size="15" text-anchor="middle" fill="#52697A">Manual retry, max 10 total</text><path d="M502 659H531" stroke="#58778A" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="539" y="608" width="422" height="102" rx="12" fill="#fff" stroke="#9EBED8" stroke-width="2"/><text x="750" y="643" font-size="19" font-weight="700" text-anchor="middle" fill="#1F3A4D">SUBMISSION_UNKNOWN</text><text x="750" y="672" font-size="15" text-anchor="middle" fill="#52697A">Review, never blind POST</text><path d="M966 659H995" stroke="#58778A" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="1003" y="608" width="422" height="102" rx="12" fill="#fff" stroke="#9EBED8" stroke-width="2"/><text x="1214" y="643" font-size="19" font-weight="700" text-anchor="middle" fill="#1F3A4D">Policy block / exhausted</text><text x="1214" y="672" font-size="15" text-anchor="middle" fill="#52697A">Terminal only if confirmed</text><path d="M750 741V768" stroke="#58778A" stroke-width="3" fill="none" marker-end="url(#arr)"/><rect x="40" y="772" width="1420" height="188" rx="19" fill="#FFF8EA" stroke="#E0C79D" stroke-width="1.7"/><text x="68" y="806" font-size="22" font-weight="700" fill="#263F54">D   FFmpeg RECOVERY</text><rect x="75" y="828" width="422" height="102" rx="12" fill="#fff" stroke="#E0C79D" stroke-width="2"/><text x="286" y="863" font-size="19" font-weight="700" text-anchor="middle" fill="#1F3A4D">First stitch fails</text><text x="286" y="892" font-size="15" text-anchor="middle" fill="#52697A">15s wait; RETRYING</text><path d="M502 879H531" stroke="#58778A" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="539" y="828" width="422" height="102" rx="12" fill="#fff" stroke="#E0C79D" stroke-width="2"/><text x="750" y="863" font-size="19" font-weight="700" text-anchor="middle" fill="#1F3A4D">One FFmpeg-only retry</text><text x="750" y="892" font-size="15" text-anchor="middle" fill="#52697A">No Google regeneration</text><path d="M966 879H995" stroke="#58778A" stroke-width="2.4" fill="none" marker-end="url(#arr)"/><rect x="1003" y="828" width="422" height="102" rx="12" fill="#fff" stroke="#E0C79D" stroke-width="2"/><text x="1214" y="863" font-size="19" font-weight="700" text-anchor="middle" fill="#1F3A4D">Success or final failure</text><text x="1214" y="892" font-size="15" text-anchor="middle" fill="#52697A">Confirm named execution</text><rect x="42" y="992" width="1416" height="93" rx="12" fill="#F4F7F9" stroke="#CBD9E0"/><text x="65" y="1024" font-size="17" font-weight="700" fill="#263F54">Status GETs do not start work. REVIEW_REQUIRED is not a final failure or refund decision.</text><text x="65" y="1052" font-size="15" fill="#52697A">Reference image, video and final MP4 reside in private S3; DynamoDB tracks stage checkpoints.</text></g></svg>