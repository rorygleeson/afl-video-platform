<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1320" viewBox="0 0 1800 1320" role="img" aria-label="AFL Video resilient processing and failure decision matrix"><rect width="1800" height="1320" fill="#fff"/><g font-family="Arial,Helvetica,sans-serif"><text x="55" y="58" font-size="31" font-weight="700" fill="#173046">RESILIENCE CONTROL FLOWS  |  WHAT IS SAFE TO RETRY?</text><text x="55" y="89" font-size="16" fill="#556F80">Current source behaviour  •  16 Nov 2026  •  Retry an operation, NEVER the entire job blindly</text><rect x="40" y="113" width="1720" height="53" rx="11" fill="#F2F5F8" stroke="#DCE4EB"/><text x="64" y="147" fill="#263E51" font-weight="700" font-size="22">1   REFERENCE IMAGE   |   SAFE PROVIDER REJECTION ONLY</text><rect x="58" y="185" width="350" height="133" rx="14" fill="#EEF6FC" stroke="#8BAED2" stroke-width="2"/><text x="75" y="215" fill="#264154" font-size="20" font-weight="700">Google image POST</text><text x="75" y="244" fill="#4D6677" font-size="15.5">3 parallel Map branches</text><text x="75" y="268" fill="#4D6677" font-size="15.5">HTTP socket timeout 240s</text><rect x="480" y="185" width="350" height="133" rx="14" fill="#EFF8F2" stroke="#8ABB9F" stroke-width="2"/><text x="497" y="215" fill="#264154" font-size="20" font-weight="700">Explicit HTTP 429</text><text x="497" y="244" fill="#4D6677" font-size="15.5">Retry-After or backoff + jitter</text><text x="497" y="268" fill="#4D6677" font-size="15.5">Up to 8 attempts / 600s window</text><rect x="902" y="185" width="350" height="133" rx="14" fill="#FFF6E9" stroke="#D7B17C" stroke-width="2"/><text x="919" y="215" fill="#264154" font-size="20" font-weight="700">Non-429 / timeout</text><text x="919" y="244" fill="#4D6677" font-size="15.5">Potentially accepted and billable</text><text x="919" y="268" fill="#4D6677" font-size="15.5">No automatic model resubmission</text><rect x="1324" y="185" width="413" height="133" rx="14" fill="#FFF0F0" stroke="#C98A86" stroke-width="2"/><text x="1341" y="215" fill="#264154" font-size="20" font-weight="700">Terminal / review</text><text x="1341" y="244" fill="#4D6677" font-size="15.5">Image worker FAILED/PARTIAL_SUCCESS</text><text x="1341" y="268" fill="#4D6677" font-size="15.5">Preserve completed other branches</text><path d="M422 249H477" stroke="#668298" stroke-width="3"/><path d="M472 242L482 249L472 256" fill="none" stroke="#668298" stroke-width="2"/><path d="M860 249H915" stroke="#668298" stroke-width="3"/><path d="M910 242L920 249L910 256" fill="none" stroke="#668298" stroke-width="2"/><path d="M1298 249H1353" stroke="#668298" stroke-width="3"/><path d="M1348 242L1358 249L1348 256" fill="none" stroke="#668298" stroke-width="2"/><rect x="40" y="351" width="1720" height="53" rx="11" fill="#F2F5F8" stroke="#DCE4EB"/><text x="64" y="385" fill="#263E51" font-weight="700" font-size="22">2   GOOGLE VIDEO   |   SAFE READ-ONLY POLLING VS BILLABLE POST</text><rect x="58" y="422" width="350" height="161" rx="14" fill="#F6F1FB" stroke="#B5A3D2" stroke-width="2"/><text x="75" y="452" fill="#264154" font-size="20" font-weight="700">DDB paid-scene claim</text><text x="75" y="481" fill="#4D6677" font-size="15.5">Named real-{jobId}-sceneN SFN</text><text x="75" y="505" fill="#4D6677" font-size="15.5">PREPARED → SUBMISSION_UNKNOWN</text><text x="75" y="529" fill="#4D6677" font-size="15.5">Mark before external POST</text><rect x="480" y="422" width="350" height="161" rx="14" fill="#FFF6E9" stroke="#D7B17C" stroke-width="2"/><text x="497" y="452" fill="#264154" font-size="20" font-weight="700">Google POST exactly once</text><text x="497" y="481" fill="#4D6677" font-size="15.5">No Submit Task Retry</text><text x="497" y="505" fill="#4D6677" font-size="15.5">No response/ID → REVIEW</text><text x="497" y="529" fill="#4D6677" font-size="15.5">Never blindly issue 2nd POST</text><rect x="902" y="422" width="350" height="161" rx="14" fill="#EFF8F2" stroke="#8ABB9F" stroke-width="2"/><text x="919" y="452" fill="#264154" font-size="20" font-weight="700">Interaction ID stored</text><text x="919" y="481" fill="#4D6677" font-size="15.5">PROCESSING → Wait 20s</text><text x="919" y="505" fill="#4D6677" font-size="15.5">PollVideo GET: +3 task retries</text><text x="919" y="529" fill="#4D6677" font-size="15.5">10 / 20 / 40s backoff</text><rect x="1324" y="422" width="413" height="161" rx="14" fill="#EEF6FC" stroke="#8BAED2" stroke-width="2"/><text x="1341" y="452" fill="#264154" font-size="20" font-weight="700">Provider final response</text><text x="1341" y="481" fill="#4D6677" font-size="15.5">COMPLETED → S3 + DDB + SFN</text><text x="1341" y="505" fill="#4D6677" font-size="15.5">FAILED → eligible manual retry</text><text x="1341" y="529" fill="#4D6677" font-size="15.5">Max 10 separately authorised attempts</text><path d="M422 500H477" stroke="#668298" stroke-width="3"/><path d="M472 493L482 500L472 507" fill="none" stroke="#668298" stroke-width="2"/><path d="M860 500H915" stroke="#668298" stroke-width="3"/><path d="M910 493L920 500L910 507" fill="none" stroke="#668298" stroke-width="2"/><path d="M1298 500H1353" stroke="#668298" stroke-width="3"/><path d="M1348 493L1358 500L1348 507" fill="none" stroke="#668298" stroke-width="2"/><rect x="40" y="615" width="1720" height="53" rx="11" fill="#F2F5F8" stroke="#DCE4EB"/><text x="64" y="649" fill="#263E51" font-weight="700" font-size="22">3   FFmpeg ASSEMBLY   |   CONFIRMED FIRST FAILURE ONLY</text><rect x="58" y="683" width="350" height="154" rx="14" fill="#EEF6FC" stroke="#8BAED2" stroke-width="2"/><text x="75" y="713" fill="#264154" font-size="20" font-weight="700">Scene 3 success event</text><text x="75" y="742" fill="#4D6677" font-size="15.5">API verifies 3 scene MP4s</text><text x="75" y="766" fill="#4D6677" font-size="15.5">DDB QUEUED + named final SFN</text><text x="75" y="790" fill="#4D6677" font-size="15.5">No Google regeneration</text><rect x="480" y="683" width="350" height="154" rx="14" fill="#FFF6E9" stroke="#D7B17C" stroke-width="2"/><text x="497" y="713" fill="#264154" font-size="20" font-weight="700">First worker failure</text><text x="497" y="742" fill="#4D6677" font-size="15.5">DDB assembly FAILED, retryCount=0</text><text x="497" y="766" fill="#4D6677" font-size="15.5">SFN Catch → Wait 15s</text><text x="497" y="790" fill="#4D6677" font-size="15.5">API: RETRYING, NOT terminal</text><rect x="902" y="683" width="350" height="154" rx="14" fill="#EFF8F2" stroke="#8ABB9F" stroke-width="2"/><text x="919" y="713" fill="#264154" font-size="20" font-weight="700">Second attempt</text><text x="919" y="742" fill="#4D6677" font-size="15.5">Only if known FAILED worker</text><text x="919" y="766" fill="#4D6677" font-size="15.5">RetryConfirmedAssemblyFailure</text><text x="919" y="790" fill="#4D6677" font-size="15.5">DDB retryCount=1</text><rect x="1324" y="683" width="413" height="154" rx="14" fill="#F6F1FB" stroke="#B5A3D2" stroke-width="2"/><text x="1341" y="713" fill="#264154" font-size="20" font-weight="700">Definitive outcome</text><text x="1341" y="742" fill="#4D6677" font-size="15.5">COMPLETED → final S3 MP4</text><text x="1341" y="766" fill="#4D6677" font-size="15.5">SFN FAILED + 2nd FAILED → terminal</text><text x="1341" y="790" fill="#4D6677" font-size="15.5">Unknown SFN → REVIEW_REQUIRED</text><path d="M422 764H477" stroke="#668298" stroke-width="3"/><path d="M472 757L482 764L472 771" fill="none" stroke="#668298" stroke-width="2"/><path d="M860 764H915" stroke="#668298" stroke-width="3"/><path d="M910 757L920 764L910 771" fill="none" stroke="#668298" stroke-width="2"/><path d="M1298 764H1353" stroke="#668298" stroke-width="3"/><path d="M1348 757L1358 764L1348 771" fill="none" stroke="#668298" stroke-width="2"/><rect x="40" y="872" width="1720" height="53" rx="11" fill="#F2F5F8" stroke="#DCE4EB"/><text x="64" y="906" fill="#263E51" font-weight="700" font-size="22">4   LOST EVENTS, UNKNOWN HANDOFFS AND CUSTOMER STATUS</text><rect x="58" y="941" width="526" height="148" rx="14" fill="#EEF6FC" stroke="#8BAED2" stroke-width="2"/><text x="75" y="971" fill="#264154" font-size="20" font-weight="700">Lost successful EventBridge event</text><text x="75" y="1000" fill="#4D6677" font-size="15.5">60s per-job watchdog, safe replay after 120s</text><text x="75" y="1024" fill="#4D6677" font-size="15.5">Only completed SFN / verified DDB / S3</text><text x="75" y="1048" fill="#4D6677" font-size="15.5">Missing watchdog start or 2h cap remains a gap</text><rect x="634" y="941" width="526" height="148" rx="14" fill="#FFF0F0" stroke="#C98A86" stroke-width="2"/><text x="651" y="971" fill="#264154" font-size="20" font-weight="700">Unknown provider / execution</text><text x="651" y="1000" fill="#4D6677" font-size="15.5">Submission unknown ≠ provider rejected</text><text x="651" y="1024" fill="#4D6677" font-size="15.5">DDB reserved but SFN missing → review</text><text x="651" y="1048" fill="#4D6677" font-size="15.5">No new paid POST, no refund conclusion</text><rect x="1210" y="941" width="527" height="148" rx="14" fill="#FFF6E9" stroke="#D7B17C" stroke-width="2"/><text x="1227" y="971" fill="#264154" font-size="20" font-weight="700">Customer and payment boundary</text><text x="1227" y="1000" fill="#4D6677" font-size="15.5">terminal=false during retry/reconciliation</text><text x="1227" y="1024" fill="#4D6677" font-size="15.5">terminal=true only with confirmed evidence</text><text x="1227" y="1048" fill="#4D6677" font-size="15.5">Stripe entitlement/refund not implemented</text><rect x="42" y="1125" width="1717" height="140" rx="12" fill="#F6F8FA" stroke="#D5DFE5"/><text x="62" y="1160" font-size="20" font-weight="700" fill="#243F54">Retried operations are distinct: image POST after definite rejection; video GET after transient failure; FFmpeg after confirmed failure.</text><text x="62" y="1189" font-size="17" fill="#516B7D">No automatic retry of ambiguous Google video POST. No automatic retry of uncertain FFmpeg PROCESSING timeout.</text><text x="62" y="1216" font-size="16" fill="#516B7D">Known open gaps: state-machine Claim JSONPath verification, missed watchdog start, durable review queue, terminal admission races and payment controls.</text><text x="62" y="1243" font-size="15" fill="#667D8B">Detailed source matrix: RETRIES_AND_TIMEOUTS.md. These diagrams document repository source, not live AWS failure-injection evidence.</text></g></svg>