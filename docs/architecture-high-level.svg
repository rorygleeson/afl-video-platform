<svg xmlns="http://www.w3.org/2000/svg" width="1510" height="1110" viewBox="0 0 1510 1110" role="img" aria-label="AFL video platform | actual processing architecture"><defs>
 <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#47657B"/></marker>
 <marker id="warning" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#BA6D45"/></marker></defs><rect width="1510" height="1110" fill="#FAFBFC"/><g font-family="Arial,Helvetica,sans-serif">
 <text x="48" y="54" font-size="31" font-weight="700" fill="#153148">AFL video platform | actual processing architecture</text><text x="48" y="83" font-size="16" fill="#567082">One uploaded selfie → 3 reference images → 3 sequential videos → final MP4  •  Repository source, 16 Nov 2026</text><text x="48" y="120" font-size="17" font-weight="700" fill="#60798B">1   BROWSER / JOB START</text><line x1="48" y1="132" x2="1462" y2="132" stroke="#D9E2E9" stroke-width="1.5"/><rect x="55" y="155" width="285" height="112" rx="12" fill="#E7F1FA" stroke="#779DBA" stroke-width="1.8"/><text x="70" y="184" font-size="19" fill="#193D55" font-weight="700">Browser / CloudFront</text><text x="70" y="209" font-size="15" fill="#405B6E">Upload selfie to private S3</text><text x="70" y="229" font-size="15" fill="#405B6E">Choose scenario, enter details</text><rect x="468" y="155" width="300" height="112" rx="12" fill="#E7F1FA" stroke="#779DBA" stroke-width="1.8"/><text x="483" y="184" font-size="19" fill="#193D55" font-weight="700">API Gateway → API Lambda</text><text x="483" y="209" font-size="15" fill="#405B6E">POST /jobs; POST /generate</text><text x="483" y="229" font-size="15" fill="#405B6E">Developer x-api-key</text><rect x="898" y="155" width="303" height="112" rx="12" fill="#FFF3E1" stroke="#D3AA71" stroke-width="1.8"/><text x="913" y="184" font-size="19" fill="#193D55" font-weight="700">DynamoDB jobs</text><text x="913" y="209" font-size="15" fill="#405B6E">Consent, scene checkpoints,</text><text x="913" y="229" font-size="15" fill="#405B6E">idempotency and approvals</text><path d="M340 210 L463 210" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M768 210 L893 210" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="48" y="324" font-size="17" font-weight="700" fill="#60798B">2   THREE REFERENCE IMAGES (PARALLEL)</text><line x1="48" y1="336" x2="1462" y2="336" stroke="#D9E2E9" stroke-width="1.5"/><rect x="55" y="365" width="290" height="113" rx="12" fill="#E6F4EB" stroke="#83B599" stroke-width="1.8"/><text x="70" y="394" font-size="19" fill="#193D55" font-weight="700">Image Step Functions</text><text x="70" y="419" font-size="15" fill="#405B6E">3-branch Map; concurrency 3</text><text x="70" y="439" font-size="15" fill="#405B6E">Single named job execution</text><rect x="455" y="365" width="310" height="113" rx="12" fill="#E6F4EB" stroke="#83B599" stroke-width="1.8"/><text x="470" y="394" font-size="19" fill="#193D55" font-weight="700">Image worker → Google</text><text x="470" y="419" font-size="15" fill="#405B6E">One image request per branch</text><text x="470" y="439" font-size="15" fill="#405B6E">429: bounded retry in worker</text><rect x="900" y="365" width="306" height="113" rx="12" fill="#FFF3E1" stroke="#D3AA71" stroke-width="1.8"/><text x="915" y="394" font-size="19" fill="#193D55" font-weight="700">Private S3 + DDB</text><text x="915" y="419" font-size="15" fill="#405B6E">Save scene1–3 PNGs</text><text x="915" y="439" font-size="15" fill="#405B6E">Persist image completion</text><path d="M345 423 L450 423" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M765 423 L895 423" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M200 267 L200 360" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="206" y="258" font-size="14" fill="#536A7D">start</text><text x="48" y="541" font-size="17" font-weight="700" fill="#60798B">3   THREE REAL VIDEOS (STRICTLY SEQUENTIAL)</text><line x1="48" y1="553" x2="1462" y2="553" stroke="#D9E2E9" stroke-width="1.5"/><rect x="55" y="585" width="279" height="119" rx="12" fill="#F0EBF9" stroke="#AD98CE" stroke-width="1.8"/><text x="70" y="614" font-size="19" fill="#193D55" font-weight="700">Video 1 Step Functions</text><text x="70" y="639" font-size="15" fill="#405B6E">Google Submit once</text><text x="70" y="659" font-size="15" fill="#405B6E">20s Google GET polling</text><rect x="465" y="585" width="279" height="119" rx="12" fill="#F0EBF9" stroke="#AD98CE" stroke-width="1.8"/><text x="480" y="614" font-size="19" fill="#193D55" font-weight="700">Video 2 Step Functions</text><text x="480" y="639" font-size="15" fill="#405B6E">Starts only after Scene 1</text><text x="480" y="659" font-size="15" fill="#405B6E">MP4 verified in S3</text><rect x="876" y="585" width="279" height="119" rx="12" fill="#F0EBF9" stroke="#AD98CE" stroke-width="1.8"/><text x="891" y="614" font-size="19" fill="#193D55" font-weight="700">Video 3 Step Functions</text><text x="891" y="639" font-size="15" fill="#405B6E">Starts only after Scene 2</text><text x="891" y="659" font-size="15" fill="#405B6E">MP4 verified in S3</text><rect x="1267" y="585" width="193" height="119" rx="12" fill="#FFF3E1" stroke="#D3AA71" stroke-width="1.8"/><text x="1282" y="614" font-size="19" fill="#193D55" font-weight="700">DDB + S3</text><text x="1282" y="639" font-size="15" fill="#405B6E">Each scene MP4</text><text x="1282" y="659" font-size="15" fill="#405B6E">and owner ID</text><path d="M334 648 L460 648" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="340" y="639" font-size="14" fill="#536A7D">AWS handoff</text><path d="M744 648 L871 648" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="750" y="639" font-size="14" fill="#536A7D">AWS handoff</text><path d="M1155 648 L1262 648" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M1048 478 L1048 517 L192 517 L192 580" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="1054" y="508" font-size="14" fill="#536A7D">image SUCCEEDED event</text><text x="48" y="762" font-size="17" font-weight="700" fill="#60798B">4   FINAL ASSEMBLY</text><line x1="48" y1="774" x2="1462" y2="774" stroke="#D9E2E9" stroke-width="1.5"/><rect x="55" y="801" width="328" height="114" rx="12" fill="#E7F1FA" stroke="#779DBA" stroke-width="1.8"/><text x="70" y="830" font-size="19" fill="#193D55" font-weight="700">EventBridge → API Lambda</text><text x="70" y="855" font-size="15" fill="#405B6E">Scene 3 SFN SUCCEEDED</text><text x="70" y="875" font-size="15" fill="#405B6E">Check 3 DDB outputs + S3</text><rect x="498" y="801" width="360" height="114" rx="12" fill="#E6F4EB" stroke="#83B599" stroke-width="1.8"/><text x="513" y="830" font-size="19" fill="#193D55" font-weight="700">Assembly SFN → FFmpeg</text><text x="513" y="855" font-size="15" fill="#405B6E">Named final-{jobId} execution</text><text x="513" y="875" font-size="15" fill="#405B6E">Retry once after known failure</text><rect x="1005" y="801" width="359" height="114" rx="12" fill="#FFF3E1" stroke="#D3AA71" stroke-width="1.8"/><text x="1020" y="830" font-size="19" fill="#193D55" font-weight="700">Private S3 final MP4</text><text x="1020" y="855" font-size="15" fill="#405B6E">videos/{jobId}/final.mp4</text><text x="1020" y="875" font-size="15" fill="#405B6E">Presigned download (5 min)</text><path d="M383 858 L493 858" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M858 858 L1000 858" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><path d="M1030 704 L1030 745 L210 745 L210 796" fill="none" stroke="#47657B" stroke-width="2.4"  marker-end="url(#arrow)"/><text x="1036" y="736" font-size="14" fill="#536A7D">Scene 3 success</text><rect x="55" y="958" width="1390" height="76" rx="10" fill="#FFFFFF" stroke="#C5D3DE"/><text x="69" y="984" font-size="15" fill="#456075">EventBridge events trigger validation; they do not themselves prove the next execution started. No fixed delays between scenes.</text><text x="69" y="1007" font-size="15" fill="#456075">Browser polls status (read-only). No Stripe payment/customer entitlement implemented. Watchdog handles some missed events (separate diagram).</text></g></svg>