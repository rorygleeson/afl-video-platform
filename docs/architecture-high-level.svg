<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1050" viewBox="0 0 1560 1050" role="img" aria-label="AFL video platform architecture diagram showing user to CloudFront, API Gateway, API Lambda, separate image and video Step Functions workflows, provider APIs and shared AWS data"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3 L0 6Z" fill="#55758B"/></marker></defs><rect width="1560" height="1050" fill="#FFFFFF"/><text x="64" y="58" font-size="19" font-weight="750" fill="#11283F">AFL VIDEO PLATFORM  /  CURRENT HIGH-LEVEL ARCHITECTURE</text><text x="64" y="85" font-size="14" fill="#52677F">AWS Sydney (ap-southeast-2)   |   Implemented developer pilot   |   November 2026</text><rect x="42" y="109" width="1475" height="180" rx="22" fill="#F8FAFD" stroke="#DCE5ED"/><text x="70" y="143" font-size="19" font-weight="750" fill="#11283F">CUSTOMER / REPLACEABLE APP / API</text><rect x="70" y="165" width="234" height="98" rx="13" fill="#FFFFFF" stroke="#2A6EA8" stroke-width="1.8"/><text x="187" y="198" text-anchor="middle" font-size="19" font-weight="700" fill="#1E344C">User / browser</text><text x="187" y="222" text-anchor="middle" font-size="14" fill="#52677F">Select team, upload selfie</text><text x="187" y="241" text-anchor="middle" font-size="14" fill="#52677F">Approve each paid scene</text><rect x="375" y="165" width="245" height="98" rx="13" fill="#EAF3FC" stroke="#2A6EA8" stroke-width="1.8"/><text x="497.5" y="198" text-anchor="middle" font-size="19" font-weight="700" fill="#1E344C">CloudFront + S3</text><text x="497.5" y="222" text-anchor="middle" font-size="14" fill="#52677F">Temporary web test app</text><text x="497.5" y="241" text-anchor="middle" font-size="14" fill="#52677F">Replaceable frontend</text><rect x="691" y="165" width="224" height="98" rx="13" fill="#EAF3FC" stroke="#2A6EA8" stroke-width="1.8"/><text x="803" y="198" text-anchor="middle" font-size="19" font-weight="700" fill="#1E344C">API Gateway</text><text x="803" y="222" text-anchor="middle" font-size="14" fill="#52677F">REST /dev, x-api-key</text><text x="803" y="241" text-anchor="middle" font-size="14" fill="#52677F">Test-only access</text><rect x="986" y="165" width="250" height="98" rx="13" fill="#EAF3FC" stroke="#2A6EA8" stroke-width="1.8"/><text x="1111" y="198" text-anchor="middle" font-size="19" font-weight="700" fill="#1E344C">API Lambda</text><text x="1111" y="222" text-anchor="middle" font-size="14" fill="#52677F">Jobs, prompts, approvals</text><text x="1111" y="241" text-anchor="middle" font-size="14" fill="#52677F">Signed S3 URLs</text><path d="M305 214 L370 214" fill="none" stroke="#2A6EA8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M622 214 L687 214" fill="none" stroke="#2A6EA8" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M917 214 L982 214" fill="none" stroke="#2A6EA8" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="318" width="1475" height="215" rx="22" fill="#F8FCFA" stroke="#DCE5ED"/><text x="70" y="350" font-size="19" font-weight="750" fill="#11283F">1   REFERENCE IMAGE GENERATION — 3 PARALLEL SCENES</text><text x="70" y="376" font-size="14" fill="#52677F">API Lambda starts this workflow after explicit image-generation request</text><rect x="70" y="399" width="316" height="103" rx="13" fill="#EBF7F1" stroke="#258264" stroke-width="1.8"/><text x="228" y="432" text-anchor="middle" font-size="19" font-weight="700" fill="#1E344C">Step Functions</text><text x="228" y="456" text-anchor="middle" font-size="14" fill="#52677F">Image workflow</text><text x="228" y="475" text-anchor="middle" font-size="14" fill="#52677F">Map concurrency = 3</text><rect x="487" y="399" width="315" height="103" rx="13" fill="#EBF7F1" stroke="#258264" stroke-width="1.8"/><text x="644.5" y="432" text-anchor="middle" font-size="19" font-weight="700" fill="#1E344C">Image-worker Lambda</text><text x="644.5" y="456" text-anchor="middle" font-size="14" fill="#52677F">3 personalised image edits</text><text x="644.5" y="475" text-anchor="middle" font-size="14" fill="#52677F">S3 read / result save</text><rect x="903" y="399" width="310" height="103" rx="13" fill="#EBF7F1" stroke="#258264" stroke-width="1.8"/><text x="1058" y="432" text-anchor="middle" font-size="19" font-weight="700" fill="#1E344C">Replicate API</text><text x="1058" y="456" text-anchor="middle" font-size="14" fill="#52677F">Nano Banana Pro</text><text x="1058" y="475" text-anchor="middle" font-size="14" fill="#52677F">3 reference PNG images</text><path d="M390 449 L483 449" fill="none" stroke="#258264" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M806 449 L899 449" fill="none" stroke="#258264" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="561" width="1475" height="215" rx="22" fill="#FBFAFD" stroke="#DCE5ED"/><text x="70" y="593" font-size="19" font-weight="750" fill="#11283F">2   REAL VIDEO GENERATION — 1 USER-APPROVED SCENE PER REQUEST</text><text x="70" y="619" font-size="14" fill="#52677F">API Lambda records a per-job/scene approval before starting the Google workflow</text><rect x="70" y="642" width="316" height="103" rx="13" fill="#F2EDFC" stroke="#7354A5" stroke-width="1.8"/><text x="228" y="675" text-anchor="middle" font-size="19" font-weight="700" fill="#1E344C">Step Functions</text><text x="228" y="699" text-anchor="middle" font-size="14" fill="#52677F">Paid Google video workflow</text><text x="228" y="718" text-anchor="middle" font-size="14" fill="#52677F">Submit, wait, poll, finish</text><rect x="487" y="642" width="315" height="103" rx="13" fill="#F2EDFC" stroke="#7354A5" stroke-width="1.8"/><text x="644.5" y="675" text-anchor="middle" font-size="19" font-weight="700" fill="#1E344C">Google-worker Lambda</text><text x="644.5" y="699" text-anchor="middle" font-size="14" fill="#52677F">Renders S3 prompt + image</text><text x="644.5" y="718" text-anchor="middle" font-size="14" fill="#52677F">Stores MP4 in private S3</text><rect x="903" y="642" width="310" height="103" rx="13" fill="#F2EDFC" stroke="#7354A5" stroke-width="1.8"/><text x="1058" y="675" text-anchor="middle" font-size="19" font-weight="700" fill="#1E344C">Google Vertex AI</text><text x="1058" y="699" text-anchor="middle" font-size="14" fill="#52677F">Interactions API</text><text x="1058" y="718" text-anchor="middle" font-size="14" fill="#52677F">Gemini Omni 1.2 Flash</text><path d="M390 692 L483 692" fill="none" stroke="#7354A5" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M806 692 L899 692" fill="none" stroke="#7354A5" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="42" y="803" width="1475" height="179" rx="22" fill="#FBFCFD" stroke="#DCE5ED"/><text x="70" y="837" font-size="19" font-weight="750" fill="#11283F">SHARED AWS DATA AND SUPPORT SERVICES</text><rect x="68" y="854" width="304" height="99" rx="13" fill="#FFF5E6" stroke="#C08A37" stroke-width="1.8"/><text x="220" y="887" text-anchor="middle" font-size="19" font-weight="700" fill="#1E344C">DynamoDB</text><text x="220" y="911" text-anchor="middle" font-size="14" fill="#52677F">Job status + 3 scene states</text><text x="220" y="930" text-anchor="middle" font-size="14" fill="#52677F">Approval and idempotency</text><rect x="398" y="854" width="335" height="99" rx="13" fill="#FFF5E6" stroke="#C08A37" stroke-width="1.8"/><text x="565.5" y="887" text-anchor="middle" font-size="19" font-weight="700" fill="#1E344C">Private media S3</text><text x="565.5" y="911" text-anchor="middle" font-size="14" fill="#52677F">Selfies, reference images</text><text x="565.5" y="930" text-anchor="middle" font-size="14" fill="#52677F">Scene MP4 files</text><rect x="759" y="854" width="346" height="99" rx="13" fill="#FFF5E6" stroke="#C08A37" stroke-width="1.8"/><text x="932" y="887" text-anchor="middle" font-size="19" font-weight="700" fill="#1E344C">Versioned asset S3</text><text x="932" y="911" text-anchor="middle" font-size="14" fill="#52677F">Master frames, configurations</text><text x="932" y="930" text-anchor="middle" font-size="14" fill="#52677F">Scene video prompts</text><rect x="1131" y="854" width="347" height="99" rx="13" fill="#FFF5E6" stroke="#C08A37" stroke-width="1.8"/><text x="1304.5" y="887" text-anchor="middle" font-size="19" font-weight="700" fill="#1E344C">Identity + observability</text><text x="1304.5" y="911" text-anchor="middle" font-size="14" fill="#52677F">Secrets Manager / Google WIF</text><text x="1304.5" y="930" text-anchor="middle" font-size="14" fill="#52677F">CloudWatch Logs</text><text x="72" y="1020" font-size="14" fill="#52677F">Data flow: API + workers read/write DynamoDB and private S3. Browser uploads media directly to S3 and plays/downloads via API-issued presigned links.</text></svg>