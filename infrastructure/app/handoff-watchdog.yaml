AWSTemplateFormatVersion: '2010-09-09'
Description: Per-job watchdog triggered by image workflow starts, with bounded wait/check loop.
Parameters:
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String
  PermissionsBoundaryArn:
    Type: String
  ActivatedAt:
    Type: String
    Description: Jobs created before this UTC ISO date are never reconciled
Resources:
  WatchdogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: afl-app-dev-handoff-watchdog-role
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BoundedReadAndExistingHandoff
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadJobsOnly
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/afl-app-dev-jobs'
              - Sid: DescribeExistingExecutionsOnly
                Effect: Allow
                Action: states:DescribeExecution
                Resource:
                  - !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:afl-app-dev-scene1-pilot:*'
                  - !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:afl-app-dev-google-omni:real-*'
                  - !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:execution:afl-app-dev-assembly:final-*'
              - Sid: StartOwnWatchdogOnly
                Effect: Allow
                Action: states:StartExecution
                Resource: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:afl-app-dev-handoff-watchdog'
              - Sid: ReplayVerifiedCompletionToExistingApiOnly
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:afl-app-dev-api'
              - Sid: WriteOwnLogsOnly
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/afl-app-dev-handoff-watchdog:*'
  WatchdogLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/afl-app-dev-handoff-watchdog
      RetentionInDays: 14
  WatchdogLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: afl-app-dev-handoff-watchdog
      Runtime: python3.13
      Handler: handler.lambda_handler
      MemorySize: 256
      Timeout: 60
      ReservedConcurrentExecutions: 1
      Role: !GetAtt WatchdogRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
      Environment:
        Variables:
          JOBS_TABLE: afl-app-dev-jobs
          WATCHDOG_MACHINE_ARN: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:afl-app-dev-handoff-watchdog'
          IMAGE_STATE_MACHINE_ARN: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:afl-app-dev-scene1-pilot'
          GOOGLE_STATE_MACHINE_ARN: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:afl-app-dev-google-omni'
          ASSEMBLY_STATE_MACHINE_ARN: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:afl-app-dev-assembly'
          API_LAMBDA_ARN: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:afl-app-dev-api'
          WATCHDOG_ACTIVATED_AT: !Ref ActivatedAt
    DependsOn: WatchdogLogs
  WatchdogMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: afl-app-dev-handoff-watchdog-sfn-role
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeOnlyOwnWatchdog
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt WatchdogLambda.Arn
  WatchdogMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: afl-app-dev-handoff-watchdog
      StateMachineType: STANDARD
      RoleArn: !GetAtt WatchdogMachineRole.Arn
      DefinitionString: !Sub |
        {
          "Comment": "One isolated monitor per authorised video job; no idle polling",
          "StartAt": "WaitOneMinute",
          "TimeoutSeconds": 7200,
          "States": {
            "WaitOneMinute": {
              "Type": "Wait",
              "Seconds": 60,
              "Next": "CheckSingleJob"
            },
            "CheckSingleJob": {
              "Type": "Task",
              "Resource": "arn:aws:states:::lambda:invoke",
              "Parameters": {
                "FunctionName": "${WatchdogLambda.Arn}",
                "Payload": {
                  "op": "check",
                  "input.$": "$"
                }
              },
              "ResultPath": "$.check",
              "Next": "KeepWatching"
            },
            "KeepWatching": {
              "Type": "Choice",
              "Choices": [{
                "Variable": "$.check.Payload.continue",
                "BooleanEquals": true,
                "Next": "WaitOneMinute"
              }],
              "Default": "Finished"
            },
            "Finished": {
              "Type": "Succeed"
            }
          }
        }
  EveryMinute:
    Type: AWS::Events::Rule
    Properties:
      Name: afl-app-dev-handoff-watchdog-image-start
      Description: Start one bounded monitoring workflow when a new image job starts
      State: ENABLED
      EventPattern:
        source:
          - aws.states
        detail-type:
          - Step Functions Execution Status Change
        detail:
          stateMachineArn:
            - !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:afl-app-dev-scene1-pilot'
          status:
            - RUNNING
      Targets:
        - Id: StartJobWatchdog
          Arn: !GetAtt WatchdogLambda.Arn
          RetryPolicy:
            MaximumEventAgeInSeconds: 3600
            MaximumRetryAttempts: 12
  InvokeFromEventBridge:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt WatchdogLambda.Arn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EveryMinute.Arn
Outputs:
  WatchdogArn:
    Value: !GetAtt WatchdogLambda.Arn
  WatchdogSchedule:
    Value: !GetAtt EveryMinute.Arn
  WatchdogStateMachineArn:
    Value: !Ref WatchdogMachine
