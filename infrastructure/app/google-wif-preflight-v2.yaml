AWSTemplateFormatVersion: '2010-09-09'
Description: One-off bounded FREE WIF diagnostic with logging, same real Omni worker AWS IAM role.
Parameters:
  ArtifactBucketName:
    Type: String
  PreflightArtifactKey:
    Type: String
  GoogleWorkerRoleArn:
    Type: String
    Default: arn:aws:iam::134387458447:role/afl-app-dev-google-omni-role
Resources:
  ProbeLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/afl-app-dev-google-omni-preflight-v2
      RetentionInDays: 3
  ProbeLogsRolePolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: afl-app-dev-google-omni-preflight-v2-logs
      Roles:
        - afl-app-dev-google-omni-role
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: [logs:CreateLogStream, logs:PutLogEvents]
            Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/afl-app-dev-google-omni-preflight-v2:*'
  WifPreflight:
    Type: AWS::Lambda::Function
    DependsOn: [ProbeLogsRolePolicy, ProbeLogGroup]
    Properties:
      FunctionName: afl-app-dev-google-omni-preflight-v2
      Description: Nonbillable AWS role to Google WIF token exchange, bounded network timeouts.
      Runtime: python3.13
      Handler: handler.lambda_handler
      Role: !Ref GoogleWorkerRoleArn
      MemorySize: 256
      Timeout: 120
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref PreflightArtifactKey
      Environment:
        Variables:
          GOOGLE_PROJECT_NUMBER: '345956846110'
          GOOGLE_WIF_POOL_ID: afl-video-aws
          GOOGLE_WIF_PROVIDER_ID: afl-aws-dev
          GOOGLE_SERVICE_ACCOUNT: afl-video-worker@afl-video-platform.iam.gserviceaccount.com
  ExecuteWifPreflight:
    Type: Custom::GoogleWifProbeV2
    Properties:
      ServiceToken: !GetAtt WifPreflight.Arn
      ServiceTimeout: 180
      CheckVersion: 2
Outputs:
  AuthenticationStatus:
    Value: !GetAtt ExecuteWifPreflight.AuthStatus
  ErrorCode:
    Value: !GetAtt ExecuteWifPreflight.ErrorCode
