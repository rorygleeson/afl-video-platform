AWSTemplateFormatVersion: '2010-09-09'
Description: AFL Stage 1B serverless API foundation for selfie uploads and jobs.
Parameters:
  ArtifactBucketName:
    Type: String
  LambdaArtifactKey:
    Type: String
  ImageWorkerArtifactKey:
    Type: String
    Description: Immutable S3 object key for image worker ZIP.
  VideoWorkerArtifactKey:
    Type: String
    Description: Immutable S3 object key for keyless Google authentication-only worker ZIP.
  VideoAdmissionTableName:
    Type: String
    Default: afl-app-dev-video-admission
  VideoStateMachineArn:
    Type: String
    Default: arn:aws:states:ap-southeast-2:134387458447:stateMachine:afl-app-dev-video
  FrontendOrigin:
    Type: String
    AllowedPattern: '^https://[a-zA-Z0-9.-]+$'
  PermissionsBoundaryArn:
    Type: String
  ScenarioAssetsBucket:
    Type: String
  ReplicateSecretName:
    Type: String
    Default: afl-app/dev/replicate-api-token
Resources:
  UploadsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub 'afl-app-dev-uploads-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: [!Ref FrontendOrigin]
            AllowedMethods: [GET, HEAD, POST]
            AllowedHeaders: ['*']
            MaxAge: 300
      LifecycleConfiguration:
        Rules:
          - Id: ExpireTestUploads
            Status: Enabled
            Prefix: uploads/
            ExpirationInDays: 7
          - Id: ExpireGeneratedTestImages
            Status: Enabled
            Prefix: results/
            ExpirationInDays: 7
          - Id: AbortIncompleteMultipart
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 1
  JobsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: afl-app-dev-jobs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: afl-app-dev-api-role
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ApiUploadsAndJobs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: PresignAndVerifyUploads
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject]
                Resource: !Sub '${UploadsBucket.Arn}/uploads/*'
              - Sid: ReadGeneratedResultImages
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${UploadsBucket.Arn}/results/*'
              - Sid: ReadCompletedVideoClips
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${UploadsBucket.Arn}/videos/*'
              - Sid: StartScene1OnExplicitRequest
                Effect: Allow
                Action: states:StartExecution
                Resource: !Ref ImageStateMachine
              - Sid: StartExplicitMockVideoScenes
                Effect: Allow
                Action: states:StartExecution
                Resource: !Ref VideoStateMachineArn
              - Sid: CheckMockVideoAdmission
                Effect: Allow
                Action: dynamodb:GetItem
                Resource: !Sub 'arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${VideoAdmissionTableName}'
              - Sid: ReadVersionedVideoPrompts
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ScenarioAssetsBucket}/scenarios/afl-grand-final-winning-kick/v1/*'
              - Sid: TestKeylessGoogleAuth
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt VideoWorkerLambda.Arn
              - Sid: FreeScene1PreflightOnGoogleWorkerOnly
                Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:afl-app-dev-google-omni-worker'
              - Sid: ExplicitScene1GoogleStateMachineOnly
                Effect: Allow
                Action: states:StartExecution
                Resource: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:afl-app-dev-google-omni'
              - Sid: StoreJobs
                Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:GetItem]
                Resource: !GetAtt JobsTable.Arn
              - Sid: WriteApiLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/afl-app-dev-api:*'
  ApiLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: afl-app-dev-api
      Runtime: python3.13
      Handler: handler.lambda_handler
      MemorySize: 256
      Timeout: 15
      Role: !GetAtt ApiRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref LambdaArtifactKey
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadsBucket
          JOBS_TABLE: !Ref JobsTable
          FRONTEND_ORIGIN: !Ref FrontendOrigin
          IMAGE_STATE_MACHINE_ARN: !Ref ImageStateMachine
          VIDEO_WORKER_ARN: !GetAtt VideoWorkerLambda.Arn
          GOOGLE_WORKER_ARN: !Sub 'arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:afl-app-dev-google-omni-worker'
          GOOGLE_STATE_MACHINE_ARN: !Sub 'arn:${AWS::Partition}:states:${AWS::Region}:${AWS::AccountId}:stateMachine:afl-app-dev-google-omni'
          REAL_VIDEO_MODE: DISABLED
          APPROVED_VIDEO_JOB_ID: ''
          SCENARIO_ASSET_BUCKET: !Ref ScenarioAssetsBucket
          VIDEO_STATE_MACHINE_ARN: !Ref VideoStateMachineArn
          VIDEO_ADMISSION_TABLE: !Ref VideoAdmissionTableName
          VIDEO_MODE: MOCK_ONLY
  ApiLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/afl-app-dev-api
      RetentionInDays: 14
  RestApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: afl-app-dev-api
      Description: Development API using API keys for throttling.
      EndpointConfiguration:
        Types: [REGIONAL]
  ProxyResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref RestApi
      ParentId: !GetAtt RestApi.RootResourceId
      PathPart: '{proxy+}'
  ProxyAny:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ProxyResource
      HttpMethod: ANY
      AuthorizationType: NONE
      ApiKeyRequired: true
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:${AWS::Partition}:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${ApiLambda.Arn}/invocations'
  ProxyOptions:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref RestApi
      ResourceId: !Ref ProxyResource
      HttpMethod: OPTIONS
      AuthorizationType: NONE
      ApiKeyRequired: false
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode":200}'
        IntegrationResponses:
          - StatusCode: '200'
            ResponseParameters:
              method.response.header.Access-Control-Allow-Origin: !Sub "'${FrontendOrigin}'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type,x-api-key,Idempotency-Key'"
              method.response.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
      MethodResponses:
        - StatusCode: '200'
          ResponseParameters:
            method.response.header.Access-Control-Allow-Origin: true
            method.response.header.Access-Control-Allow-Headers: true
            method.response.header.Access-Control-Allow-Methods: true
  Default4xxResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${FrontendOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,x-api-key,Idempotency-Key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
  Default5xxResponse:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref RestApi
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${FrontendOrigin}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,x-api-key,Idempotency-Key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,OPTIONS'"
  InvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${RestApi}/*/*/*'
  ApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn: [ProxyAny, ProxyOptions]
    Properties:
      RestApiId: !Ref RestApi
      StageName: dev
  ApiKey:
    Type: AWS::ApiGateway::ApiKey
    Properties:
      Name: afl-app-dev-test-api-key
      Enabled: true
  ApiUsagePlan:
    Type: AWS::ApiGateway::UsagePlan
    DependsOn: ApiDeployment
    Properties:
      UsagePlanName: afl-app-dev-test-plan
      ApiStages:
        - ApiId: !Ref RestApi
          Stage: dev
      Throttle:
        BurstLimit: 10
        RateLimit: 5
      Quota:
        Limit: 10000
        Period: MONTH
  UsagePlanKey:
    Type: AWS::ApiGateway::UsagePlanKey
    Properties:
      KeyId: !Ref ApiKey
      KeyType: API_KEY
      UsagePlanId: !Ref ApiUsagePlan
  VideoWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: afl-app-dev-video-worker-role
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GoogleFederationProbeOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: WriteProbeLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/afl-app-dev-video-worker:*'
  VideoWorkerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: afl-app-dev-video-worker
      Description: Google Cloud WIF auth check only; NO paid video generation implemented.
      Runtime: python3.13
      Handler: handler.lambda_handler
      MemorySize: 256
      Timeout: 50
      Role: !GetAtt VideoWorkerRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref VideoWorkerArtifactKey
      Environment:
        Variables:
          GOOGLE_PROJECT_NUMBER: '345956846110'
          GOOGLE_WIF_POOL_ID: afl-video-aws
          GOOGLE_WIF_PROVIDER_ID: afl-aws-dev
          GOOGLE_SERVICE_ACCOUNT: afl-video-worker@afl-video-platform.iam.gserviceaccount.com
          VIDEO_GENERATION_ENABLED: 'false'
  VideoWorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/afl-app-dev-video-worker
      RetentionInDays: 14
  ImageWorkerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: afl-app-dev-image-worker-role
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PilotImageWorker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ReadSourceSelfies
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${UploadsBucket.Arn}/uploads/*'
              - Sid: WriteResults
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub '${UploadsBucket.Arn}/results/*'
              - Sid: ReadVersionedScenarioMastersAndConfig
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub 'arn:${AWS::Partition}:s3:::${ScenarioAssetsBucket}/scenarios/afl-grand-final-winning-kick/v1/*'
              - Sid: ReadReplicateToken
                Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Sub 'arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${ReplicateSecretName}-*'
              - Sid: UpdateAndReadJobs
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:UpdateItem, dynamodb:Scan]
                Resource: !GetAtt JobsTable.Arn
              - Sid: WorkerLogging
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/afl-app-dev-image-worker:*'
  ImageWorkerLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: afl-app-dev-image-worker
      Runtime: python3.13
      Handler: handler.lambda_handler
      MemorySize: 256
      Timeout: 600
      Role: !GetAtt ImageWorkerRole.Arn
      Code:
        S3Bucket: !Ref ArtifactBucketName
        S3Key: !Ref ImageWorkerArtifactKey
      Environment:
        Variables:
          UPLOAD_BUCKET: !Ref UploadsBucket
          ASSET_BUCKET: !Ref ScenarioAssetsBucket
          JOBS_TABLE: !Ref JobsTable
          REPLICATE_SECRET_NAME: !Ref ReplicateSecretName
          SCENARIO_CONFIG_KEY: scenarios/afl-grand-final-winning-kick/v1/config.json
  ImageWorkerLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/afl-app-dev-image-worker
      RetentionInDays: 14
  ImageStateMachineRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: afl-app-dev-image-sfn-role
      PermissionsBoundary: !Ref PermissionsBoundaryArn
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: states.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeImageWorker
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ImageWorkerLambda.Arn
  ImageStateMachine:
    Type: AWS::StepFunctions::StateMachine
    Properties:
      StateMachineName: afl-app-dev-scene1-pilot
      StateMachineType: STANDARD
      RoleArn: !GetAtt ImageStateMachineRole.Arn
      Definition:
        Comment: Parallel, independently tracked Replicate edits for all configured scenes.
        StartAt: Prepare
        TimeoutSeconds: 1800
        States:
          Prepare:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${WorkerArn}
              Payload:
                op: prepare
                jobId.$: $.jobId
            ResultPath: $.prepared
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: RecoverJob
            Next: ParallelScenes
          ParallelScenes:
            Type: Map
            ItemsPath: $.prepared.Payload.scenes
            MaxConcurrency: 3
            ItemSelector:
              jobId.$: $.jobId
              sceneId.$: $$.Map.Item.Value
            ResultPath: $.sceneResults
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: RecoverJob
            ItemProcessor:
              ProcessorConfig:
                Mode: INLINE
              StartAt: Submit
              States:
                Submit:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: ${WorkerArn}
                    Payload:
                      op: submit
                      jobId.$: $.jobId
                      sceneId.$: $.sceneId
                  ResultPath: $.submitted
                  Catch:
                    - ErrorEquals: [States.ALL]
                      ResultPath: $.error
                      Next: MarkSceneFailed
                  Next: WaitForPrediction
                WaitForPrediction:
                  Type: Wait
                  Seconds: 12
                  Next: Poll
                Poll:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: ${WorkerArn}
                    Payload:
                      op: check
                      jobId.$: $.jobId
                      sceneId.$: $.sceneId
                      predictionId.$: $.submitted.Payload.predictionId
                  ResultPath: $.poll
                  Retry:
                    - ErrorEquals: [States.TaskFailed]
                      IntervalSeconds: 4
                      MaxAttempts: 2
                      BackoffRate: 2
                  Catch:
                    - ErrorEquals: [States.ALL]
                      ResultPath: $.error
                      Next: MarkSceneFailed
                  Next: PredictionStatus
                PredictionStatus:
                  Type: Choice
                  Choices:
                    - Variable: $.poll.Payload.status
                      StringEquals: succeeded
                      Next: SaveScene
                    - Variable: $.poll.Payload.status
                      StringEquals: failed
                      Next: MarkSceneFailed
                  Default: WaitForPrediction
                SaveScene:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: ${WorkerArn}
                    Payload:
                      op: save
                      jobId.$: $.jobId
                      sceneId.$: $.sceneId
                      predictionId.$: $.submitted.Payload.predictionId
                      output.$: $.poll.Payload.output
                  Catch:
                    - ErrorEquals: [States.ALL]
                      ResultPath: $.error
                      Next: MarkSceneFailed
                  End: true
                MarkSceneFailed:
                  Type: Task
                  Resource: arn:aws:states:::lambda:invoke
                  Parameters:
                    FunctionName: ${WorkerArn}
                    Payload:
                      op: failed
                      jobId.$: $.jobId
                      sceneId.$: $.sceneId
                  End: true
            Next: Finalize
          Finalize:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${WorkerArn}
              Payload:
                op: finalize
                jobId.$: $.jobId
            Catch:
              - ErrorEquals: [States.ALL]
                ResultPath: $.error
                Next: RecoverJob
            End: true
          RecoverJob:
            Type: Task
            Resource: arn:aws:states:::lambda:invoke
            Parameters:
              FunctionName: ${WorkerArn}
              Payload:
                op: recover
                jobId.$: $.jobId
            End: true
      DefinitionSubstitutions:
        WorkerArn: !GetAtt ImageWorkerLambda.Arn
  ImageReconcileSchedule:
    Type: AWS::Events::Rule
    Properties:
      Name: afl-app-dev-reconcile-images
      Description: Recover image jobs stuck beyond Step Functions timeout; never retries paid calls.
      ScheduleExpression: rate(5 minutes)
      State: ENABLED
      Targets:
        - Id: ReconcileImageJobs
          Arn: !GetAtt ImageWorkerLambda.Arn
          Input: '{"op":"reconcile"}'
  ImageReconcileInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ImageWorkerLambda
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ImageReconcileSchedule.Arn
  ImageStateMachineLogs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/vendedlogs/states/afl-app-dev-scene1-pilot
      RetentionInDays: 14
Outputs:
  ApiBaseUrl:
    Value: !Sub 'https://${RestApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/dev'
  ApiKeyId:
    Value: !Ref ApiKey
  UploadsBucketName:
    Value: !Ref UploadsBucket
  JobsTableName:
    Value: !Ref JobsTable
  ImageStateMachineArn:
    Value: !Ref ImageStateMachine
  VideoWorkerLambdaArn:
    Value: !GetAtt VideoWorkerLambda.Arn
