name: AFL image-only CloudFormation preview (never execute)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/image-only-preview.yml'
permissions:
  contents: read
  id-token: write
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Get pinned direct-Google migration candidate and build image ZIP
        run: |
          git fetch --no-tags --depth=1 origin 66a7b183644265e9d775b6c2969229fb91a35451
          test "$(git rev-parse FETCH_HEAD)" = 66a7b183644265e9d775b6c2969229fb91a35451
          git worktree add --detach /tmp/image-migration FETCH_HEAD
          python3 /tmp/image-migration/scripts/build_release_artifacts.py > /dev/null
      - name: Assume existing AWS deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
          role-session-name: afl-image-only-preview
      - name: Stage immutable image ZIP and preview ONLY image CFN resources
        run: |
          python3 - <<'PY'
          import boto3,hashlib,json,time,os,sys
          from pathlib import Path
          from botocore.exceptions import ClientError
          sys.path.insert(0,"scripts")
          from validate_change_set import validate
          source=Path("/tmp/image-migration")
          artifact=json.loads((source/"dist/release/manifest.json").read_text())["artifacts"]["image-worker"]
          image=(source/artifact["local_file"]).read_bytes()
          digest=hashlib.sha256(image).hexdigest()
          if digest!=artifact["sha256_hex"] or not artifact["s3_key"].startswith(f"releases/sha256/{digest}/"):
              raise RuntimeError("Invalid deterministic image ZIP")
          cf=boto3.client("cloudformation",region_name="ap-southeast-2")
          s3=boto3.client("s3",region_name="ap-southeast-2")
          lam=boto3.client("lambda",region_name="ap-southeast-2")
          stack="afl-app-dev-backend"
          live=cf.describe_stacks(StackName=stack)["Stacks"][0]
          if live["StackStatus"]!="UPDATE_COMPLETE":
              raise RuntimeError("Backend stack not stable")
          params={p["ParameterKey"]:p.get("ParameterValue") for p in live["Parameters"]}
          fn=lam.get_function_configuration(FunctionName="afl-app-dev-image-worker")
          if fn.get("State")!="Active" or fn.get("LastUpdateStatus")!="Successful":
              raise RuntimeError("Current image Lambda not healthy")
          if not params.get("ArtifactBucketName") or not params.get("ImageWorkerArtifactKey"):
              raise RuntimeError("Missing live image artifact settings")
          bucket=params["ArtifactBucketName"]
          key=artifact["s3_key"]
          try:
              obj=s3.get_object(Bucket=bucket,Key=key)
          except ClientError as error:
              if error.response.get("Error",{}).get("Code") not in ("404","NoSuchKey"):
                  raise
              s3.put_object(Bucket=bucket,Key=key,Body=image,IfNoneMatch="*",ContentType="application/zip")
          else:
              with obj["Body"] as body: existing=body.read()
              if hashlib.sha256(existing).hexdigest()!=digest:
                  raise RuntimeError("Immutable S3 release ZIP mismatch")
          obj=s3.get_object(Bucket=bucket,Key=key)
          with obj["Body"] as body: uploaded=body.read()
          if hashlib.sha256(uploaded).hexdigest()!=digest:
              raise RuntimeError("Remote release ZIP differs from source")
          new=dict(params,ImageWorkerArtifactKey=key)
          preview_name="afl-image-only-"+os.environ["GITHUB_RUN_ID"]
          report={"executed":False,"old_image_artifact_key":params["ImageWorkerArtifactKey"],
                  "old_image_code_sha256":fn["CodeSha256"],
                  "new_image_artifact_key":key,"new_image_sha256_hex":digest,
                  "pinned_candidate_sha":"66a7b183644265e9d775b6c2969229fb91a35451",
                  "verdict":"NOT_CHECKED"}
          created=False
          try:
              cf.create_change_set(StackName=stack,ChangeSetName=preview_name,ChangeSetType="UPDATE",
                  TemplateBody=(source/"infrastructure/app/backend.yaml").read_text(),
                  Parameters=[{"ParameterKey":k,"ParameterValue":v} for k,v in sorted(new.items())],
                  Capabilities=["CAPABILITY_NAMED_IAM"],
                  Description="PREVIEW ONLY - direct Google image migration; never execute")
              created=True
              for _ in range(90):
                  doc=cf.describe_change_set(StackName=stack,ChangeSetName=preview_name)
                  if doc["Status"] in ("CREATE_COMPLETE","FAILED"):
                      break
                  time.sleep(2)
              else: raise RuntimeError("CloudFormation change set timeout")
              changes=list(doc.get("Changes",[]))
              token=doc.get("NextToken")
              while token:
                  page=cf.describe_change_set(StackName=stack,ChangeSetName=preview_name,NextToken=token)
                  if page.get("ChangeSetId")!=doc.get("ChangeSetId") or page.get("StackId")!=doc.get("StackId"):
                      raise RuntimeError("Change set pagination identity mismatch")
                  changes.extend(page.get("Changes",[]))
                  token=page.get("NextToken")
              allowed={"ImageWorkerLambda","ImageWorkerRole","ImageStateMachine"}
              errors=validate(dict(doc,Changes=changes),allowed)
              results=[{"logical_id":c.get("ResourceChange",{}).get("LogicalResourceId"),
                        "action":c.get("ResourceChange",{}).get("Action"),
                        "replacement":c.get("ResourceChange",{}).get("Replacement"),
                        "details":c.get("ResourceChange",{}).get("Details",[])} for c in changes]
              extra=[x["logical_id"] for x in results if x["logical_id"] not in allowed]
              if extra: errors.append("Unexpected resources: "+repr(extra))
              report.update({"verdict":"SAFE_PREVIEW" if not errors else "BLOCKED",
                             "changes":results,"issues":errors})
              print("IMAGE_ONLY_CHANGE_SET="+json.dumps(report,default=str))
              if errors: raise RuntimeError("Image change set contains forbidden changes")
          finally:
              Path("image-preview-report.json").write_text(json.dumps(report,indent=2,default=str))
              if created:
                  cf.delete_change_set(StackName=stack,ChangeSetName=preview_name)
          PY
      - name: Upload change-set preview report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-preview-report
          path: image-preview-report.json
          retention-days: 30
          if-no-files-found: warn
