name: Diagnose recent stitching jobs (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-stitching-readonly.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
          role-session-name: audit-stitching-readonly
      - name: Inspect recent final assemblies without modifying anything
        shell: bash
        run: |
          python - <<'PY'
          import boto3
          from botocore.exceptions import ClientError
          sf=boto3.client('stepfunctions',region_name='ap-southeast-2')
          ddb=boto3.resource('dynamodb',region_name='ap-southeast-2').Table('afl-app-dev-jobs')
          s3=boto3.client('s3',region_name='ap-southeast-2')
          arn='arn:aws:states:ap-southeast-2:134387458447:stateMachine:afl-app-dev-assembly'
          bucket='afl-app-dev-uploads-134387458447-ap-southeast-2'
          try:
              executions=sf.list_executions(stateMachineArn=arn,maxResults=15).get('executions',[])
          except ClientError as exc:
              print('EXECUTION_LIST_UNAVAILABLE',exc.response.get('Error',{}).get('Code','UNKNOWN'))
              raise
          print('RECENT_ASSEMBLY_COUNT',len(executions))
          for index,item in enumerate(executions[:10],1):
              name=item.get('name','')
              job=name.removeprefix('final-') if name.startswith('final-') else ''
              print('ASSEMBLY',index,'EXECUTION',item.get('status','UNKNOWN'),'START',str(item.get('startDate',''))[:19])
              if len(job)!=32 or any(c not in '0123456789abcdef' for c in job):
                  print('  UNRECOGNISED_NAME')
                  continue
              try:
                  record=ddb.get_item(Key={'jobId':job},ConsistentRead=True).get('Item',{})
                  assembly=record.get('assembly') or {}
                  print('  DDB_ASSEMBLY',assembly.get('status','MISSING'),'RETRY_COUNT',assembly.get('retryCount','0'),'ERROR',str(assembly.get('errorCode','-'))[:80])
                  print('  SOURCE_STATUSES',' '.join(str((record.get('realVideos') or {}).get(f'scene{i}',{}).get('status','MISSING')) for i in (1,2,3)))
              except ClientError as exc:
                  print('  DDB_UNAVAILABLE',exc.response.get('Error',{}).get('Code','UNKNOWN'))
              for label,suffix in [('FINAL','final.mp4'),('SCENE1','scene1.mp4'),('SCENE2','scene2.mp4'),('SCENE3','scene3.mp4')]:
                  try:
                      head=s3.head_object(Bucket=bucket,Key=f'videos/{job}/{suffix}')
                      print(' ',label,'EXISTS',head.get('ContentLength',0),'BYTES')
                  except ClientError as exc:
                      print(' ',label,'UNAVAILABLE',exc.response.get('Error',{}).get('Code','UNKNOWN'))
              try:
                  details=sf.describe_execution(executionArn=item['executionArn'])
                  print('  SFN_STATUS',details.get('status','UNKNOWN'),'ERROR',str(details.get('error','-'))[:80])
                  if details.get('status') in ('FAILED','TIMED_OUT','ABORTED'):
                      history=sf.get_execution_history(executionArn=item['executionArn'],reverseOrder=True,includeExecutionData=False,maxResults=70)
                      for event in history.get('events',[]):
                          if any(x in event.get('type','') for x in ('Failed','TimedOut','Aborted')):
                              print('  FAILURE_EVENT_TYPE',event.get('type'))
                              break
              except ClientError as exc:
                  print('  SFN_DETAILS_UNAVAILABLE',exc.response.get('Error',{}).get('Code','UNKNOWN'))
          print('READ_ONLY: no StartExecution, no Lambda Invoke, no Google, no writes')
          PY
