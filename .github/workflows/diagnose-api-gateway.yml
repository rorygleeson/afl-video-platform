name: Diagnose API Gateway configuration (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-api-gateway.yml']
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
      - name: Inspect API Gateway configuration without viewing credentials
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks --stack-name afl-app-dev-backend --output json > /tmp/stack.json
          api_id=$(jq -r '.Stacks[0].Outputs[]|select(.OutputKey=="ApiBaseUrl")|.OutputValue' /tmp/stack.json | sed -E 's@https://([^.]+).*@\1@')
          key_id=$(jq -r '.Stacks[0].Outputs[]|select(.OutputKey=="ApiKeyId")|.OutputValue' /tmp/stack.json)
          echo "Stack status: $(jq -r '.Stacks[0].StackStatus' /tmp/stack.json)"
          echo "API ID: $api_id"
          echo "API stage: dev"
          aws apigateway get-api-key --api-key "$key_id" --no-include-value --output json > /tmp/apikey.json
          echo "Key enabled: $(jq -r '.enabled' /tmp/apikey.json)"
          aws apigateway get-usage-plans --key-id "$key_id" --output json > /tmp/plans.json
          jq -r --arg api "$api_id" '.items[] | "Usage plan: "+.name+"; linked to API/dev: "+ ((any(.apiStages[]?; .apiId==$api and .stage=="dev"))|tostring)' /tmp/plans.json
          aws apigateway get-stages --rest-api-id "$api_id" --query 'item[].{stage:stageName, deploymentId:deploymentId}' --output json
          aws apigateway get-method --rest-api-id "$api_id" --resource-id "$(aws apigateway get-resources --rest-api-id "$api_id" --query 'items[?path==`/{proxy+}`].id | [0]' --output text)" --http-method ANY --query '{apiKeyRequired:apiKeyRequired}' --output json
