name: Diagnose API Gateway configuration (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-api-gateway.yml']
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
      - name: Compare live CloudFormation API resources and recent events
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks --stack-name afl-app-dev-backend --output json > /tmp/stack.json
          echo "Stack status: $(jq -r '.Stacks[0].StackStatus' /tmp/stack.json)"
          echo "API Base URL: $(jq -r '.Stacks[0].Outputs[] | select(.OutputKey=="ApiBaseUrl") | .OutputValue' /tmp/stack.json)"
          echo "Current API key ID (not secret): $(jq -r '.Stacks[0].Outputs[] | select(.OutputKey=="ApiKeyId") | .OutputValue' /tmp/stack.json)"
          aws cloudformation describe-stack-events --stack-name afl-app-dev-backend --output json > /tmp/events.json
          echo "Most recent API resource events:"
          jq -r '[.StackEvents[]|select(.LogicalResourceId|test("Api|UsagePlan|Deployment|Proxy"))][:25][]|[.Timestamp,.LogicalResourceId,.ResourceStatus,.ResourceStatusReason//""]|@tsv' /tmp/events.json
          echo "Frontend runtime API target:"
          python - <<'PY'
          import urllib.request,re
          try:
              u=urllib.request.urlopen('https://d9i3mlqvt0ks6.cloudfront.net/config.js',timeout=12).read().decode()
              for url in re.findall(r'https://[a-zA-Z0-9.-]+/dev',u):
                  print('Config target:',url)
          except Exception as exc:
              print('Frontend config unavailable:',type(exc).__name__)
          PY
          echo "All recorded key/usage-plan/deployment resource events:"
          jq -r '[.StackEvents[]|select(.LogicalResourceId|test("ApiKey|ApiUsagePlan|UsagePlanKey|ApiDeployment|RestApi"))][:60][]|[.Timestamp,.LogicalResourceId,.ResourceStatus,.ResourceStatusReason//""]|@tsv' /tmp/events.json
          jq -e 'any(.StackEvents[]; .LogicalResourceId=="ApiDeploymentRecovery20261108" and .ResourceStatus=="CREATE_COMPLETE")' /tmp/events.json >/dev/null
          echo "Verified fresh API deployment was created successfully. No key values accessed."
