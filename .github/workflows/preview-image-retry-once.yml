name: One-time preview Google image retry release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/preview-image-retry-once.yml'
permissions:
  contents: read
  id-token: write
jobs:
  audit-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install release dependencies
        run: python -m pip install --disable-pip-version-check 'boto3>=1.35,<2'
      - name: Compile changed code without executing paid calls
        run: |
          python -m py_compile src/api/handler.py src/image_worker/handler.py src/image_worker/google_direct.py
          node --check frontend/app.js
      - name: Build immutable release artifact keys (no upload)
        run: python scripts/build_release_artifacts.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
          role-session-name: afl-image-retry-preview
      - name: Verify live source, active executions, and preview exact CFN changes (NO DEPLOYMENT)
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, boto3, hashlib, io, json, subprocess, urllib.request, zipfile
          from pathlib import Path
          reg='ap-southeast-2'
          cf=boto3.client('cloudformation',region_name=reg)
          lam=boto3.client('lambda',region_name=reg)
          sf=boto3.client('stepfunctions',region_name=reg)
          stack='afl-app-dev-backend'
          current=cf.describe_stacks(StackName=stack)['Stacks'][0]
          assert current['StackStatus']=='UPDATE_COMPLETE', 'Backend stack is not safe to change'
          print('LIVE_BACKEND_STACK_UPDATE_COMPLETE')
          # Compare every existing runtime source file with the exact pre-change
          # repository baseline. Never overwrite an unexpected hotfix.
          files={
            'afl-app-dev-api': {'handler.py':'src/api/handler.py'},
            'afl-app-dev-image-worker': {
              'handler.py':'src/image_worker/handler.py',
              'google_direct.py':'src/image_worker/google_direct.py'}
          }
          for name, mapping in files.items():
            live=lam.get_function(FunctionName=name)
            url=live['Code']['Location']
            raw=urllib.request.urlopen(url,timeout=45).read()
            with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for filename, source in mapping.items():
                previous=subprocess.check_output(['git','show','213ea884023601f8de5156a8e469116f4b4c0a65^:'+source])
                if z.read(filename)!=previous:
                  raise SystemExit(f'STOP: deployed {name}/{filename} differs from repository pre-change baseline')
            print('LIVE_CODE_BASELINE_MATCHES '+name)
          machine=cf.describe_stack_resource(StackName=stack,LogicalResourceId='ImageStateMachine')['StackResourceDetail']['PhysicalResourceId']
          active=sf.list_executions(stateMachineArn=machine,statusFilter='RUNNING',maxResults=15).get('executions',[])
          if active:
            raise SystemExit(f'STOP: {len(active)} image generations still active')
          print('NO_ACTIVE_IMAGE_EXECUTIONS')
          manifest=json.loads(Path('dist/release/manifest.json').read_text())
          artifacts=manifest['artifacts']
          params={p['ParameterKey']: p['ParameterValue'] for p in current['Parameters']}
          for name,kind in [('LambdaArtifactKey','api'),('ImageWorkerArtifactKey','image-worker')]:
            assert name in params
            params[name]=artifacts[kind]['s3_key']
          name='afl-image-retry-preview-'+str(__import__('os').environ['GITHUB_RUN_ID'])
          try:
            cf.create_change_set(
              StackName=stack,ChangeSetName=name,ChangeSetType='UPDATE',
              TemplateBody=Path('infrastructure/app/backend.yaml').read_text(),
              Parameters=[{'ParameterKey':k,'ParameterValue':v} for k,v in sorted(params.items())],
              Capabilities=['CAPABILITY_NAMED_IAM'],
              Description='Preview only: retry explicit image 429s with Step Functions waits')
            print('CHANGESET_CREATED_FOR_PREVIEW_ONLY')
            for _ in range(35):
              import time
              result=cf.describe_change_set(ChangeSetName=name,StackName=stack)
              if result['Status']!='CREATE_PENDING' and result['Status']!='CREATE_IN_PROGRESS':
                break
              time.sleep(3)
            assert result['Status']=='CREATE_COMPLETE', result['Status']+' '+result.get('StatusReason','')
            changes=list(result['Changes'])
            while result.get('NextToken'):
              result=cf.describe_change_set(ChangeSetName=name,StackName=stack,NextToken=result['NextToken'])
              changes+=result['Changes']
            resources=[]
            for item in changes:
              r=item['ResourceChange']
              resources.append({'logical':r['LogicalResourceId'],'action':r['Action'],'replacement':r.get('Replacement'),'detail': [
                {'source':d.get('ChangeSource'),'evaluation':d.get('Evaluation'),
                 'causing':d.get('CausingEntity'),'property':d.get('Target',{}).get('Name')} for d in r.get('Details',[])]})
            print('CHANGESET_RESOURCE_PREVIEW='+json.dumps(resources,sort_keys=True))
            allowed={'ApiLambda','ImageWorkerLambda','ImageStateMachine'}
            unexpected=[r for r in resources if r['logical'] not in allowed]
            if unexpected:
              print('PREVIEW_HAS_OTHER_RESOURCES_REQUIRES_MANUAL_REVIEW')
            else:
              print('PREVIEW_ONLY_EXPECTED_RESOURCES')
            print('NO_EXECUTION_PERFORMED')
          finally:
            try:
              cf.delete_change_set(ChangeSetName=name,StackName=stack)
              print('PREVIEW_CHANGESET_DELETED')
            except Exception as e:
              print('PREVIEW_CHANGESET_CLEANUP_ERROR='+type(e).__name__)
          PY
