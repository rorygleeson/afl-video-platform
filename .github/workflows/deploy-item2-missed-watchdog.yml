name: Deploy Item 2 missing-watchdog recovery (guarded)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-item2-missed-watchdog.yml'
      - 'scripts/deploy_item2_missing_watchdog.py'
permissions:
  contents: read
  id-token: write
concurrency:
  group: afl-dev-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ contains(github.event.head_commit.message, '[deploy-item2-watchdog]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Offline static checks and isolated safety tests before AWS access
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'boto3>=1.35,<2' 'cfn-lint>=1,<2'
          python -m py_compile scripts/deploy_item2_missing_watchdog.py src/handoff_watchdog/handler.py src/image_worker/handler.py
          cfn-lint infrastructure/app/backend.yaml infrastructure/app/handoff-watchdog.yaml --regions ap-southeast-2
          python -m unittest discover -s tests -p 'test_handoff_watchdog.py' -v
          python -m unittest discover -s tests -p 'test_watchdog_image_reconciler.py' -v
          ! grep -Eq 'googleapis|start_real_scene|start_video_sequence|dynamodb:UpdateItem|JOBS.scan' src/handoff_watchdog/handler.py
          ! grep -Eq 'StartScene1OnExplicitRequest|states:StartExecution' scripts/deploy_item2_missing_watchdog.py
          grep -q 'BootstrapExistingWatchdogOnly' infrastructure/app/backend.yaml
          grep -q 'def ensure_monitor_for_existing_image_job' src/handoff_watchdog/handler.py
          grep -q 'def reconcile_stalled' src/image_worker/handler.py
      - name: Authenticate existing AWS deployment role after tests
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
          role-session-name: deploy-item2-missed-watchdog
      - name: Preview both targeted changesets, guard replacements and deploy with readback
        env:
          DEPLOY_ITEM2: AUTHORIZE_MISSED_WATCHDOG
        run: python -u scripts/deploy_item2_missing_watchdog.py
