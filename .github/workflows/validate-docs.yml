name: Validate documentation against current implementation
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'tests/test_documentation_contract.py'
      - 'src/api/handler.py'
      - 'infrastructure/app/google-video.yaml'
      - 'infrastructure/app/assembly.yaml'
      - '.github/workflows/validate-docs.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tests/test_documentation_contract.py'
      - 'src/api/handler.py'
      - 'infrastructure/app/google-video.yaml'
      - 'infrastructure/app/assembly.yaml'
      - '.github/workflows/validate-docs.yml'
permissions:
  contents: read
jobs:
  docs-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify canonical documentation and code-driven contracts offline
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_documentation_contract.py' -v
