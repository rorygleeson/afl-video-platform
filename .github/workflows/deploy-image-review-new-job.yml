name: Restore Start new video during image review
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-image-review-new-job.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: afl-dev-deploy
  cancel-in-progress: false
jobs:
  new-job:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify image review reset and zero automatic paid submissions
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'boto3>=1.35,<2'
          python -m py_compile src/api/handler.py scripts/deploy_overall_job_progress.py
          python -m unittest discover -s tests -p 'test_aws_video_sequence.py' -v
          node --check frontend/app.js
          node --test tests/test_frontend_poll.cjs
          grep -q 'referenceImagesReadyForReview' frontend/app.js
          grep -q 'confirmPaidSequence: false' frontend/app.js
          python scripts/check_deployment_ownership.py --enforce
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
          role-session-name: deploy-image-review-new-job
      - name: Publish verified frontend and unchanged API
        env:
          DEPLOY_PROGRESS_CHANGE: DEPLOY_JOB_PROGRESS_ONLY
        run: python -u scripts/deploy_overall_job_progress.py
