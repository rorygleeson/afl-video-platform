name: Deploy Stage 5A hard-disabled Google Omni adapter
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-google-video.yml'
      - 'infrastructure/app/google-video.yaml'
      - 'src/google_video_worker/**'
      - 'tests/test_google_video_stage5a.py'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: afl-google-video-stage5a
  cancel-in-progress: false
jobs:
  deploy-locked-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check 'boto3>=1.35,<2' 'cfn-lint>=1,<2'
      - name: Validate exact hard-disabled contract
        run: |
          set -euo pipefail
          cfn-lint infrastructure/app/google-video.yaml --regions ap-southeast-2
          python -m py_compile src/google_video_worker/handler.py
          python -m unittest discover -s tests -p 'test_google_video_stage5a.py' -v
          python - <<'PY'
          from pathlib import Path
          c=Path('infrastructure/app/google-video.yaml').read_text()
          assert "PAID_GENERATION_ENABLED: 'false'" in c
          assert "GOOGLE_VIDEO_MODEL: UNCONFIGURED" in c
          assert '"StartAt":"PaidGate"' in c
          assert 'AWS::ApiGateway::' not in c
          PY
      - name: Assume existing deploy role with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
      - name: Refuse to modify an existing Google adapter stack
        run: |
          set -euo pipefail
          if aws cloudformation describe-stacks --stack-name afl-app-dev-google-video >/dev/null 2>&1; then
            echo 'Stage 5A is create-only. Refusing to update an existing stack.'
            exit 1
          fi
          test "$(aws cloudformation describe-stacks --stack-name afl-app-dev-video --query 'Stacks[0].StackStatus' --output text)" = CREATE_COMPLETE
      - name: Bundle Google WIF Python dependencies and prompt renderer
        run: |
          set -euo pipefail
          mkdir -p dist/google-video
          python -m pip install --disable-pip-version-check --target dist/google-video 'google-auth[requests]>=2.30,<3'
          cp src/google_video_worker/handler.py src/api/video_prompts.py dist/google-video/
          (cd dist/google-video && zip -q -r ../google-video.zip .)
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/google-video.zip') as z:
              names=set(z.namelist())
              assert 'handler.py' in names and 'video_prompts.py' in names
              assert any(x.startswith('google/auth/') for x in names)
          PY
          aws s3 cp dist/google-video.zip "s3://afl-video-bootstrap-artifactbucket-xiuriidgyft4/google-video/$GITHUB_SHA.zip" --region ap-southeast-2
      - name: Create only new hard-disabled Google adapter stack
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --region ap-southeast-2 \
            --stack-name afl-app-dev-google-video \
            --template-file infrastructure/app/google-video.yaml \
            --parameter-overrides \
              ArtifactBucketName=afl-video-bootstrap-artifactbucket-xiuriidgyft4 \
              GoogleWorkerArtifactKey=google-video/$GITHUB_SHA.zip \
              PermissionsBoundaryArn=arn:aws:iam::134387458447:policy/afl-video-app-permissions-boundary \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn arn:aws:iam::134387458447:role/afl-video-cfn-execution-role
      - name: Verify only new stack with hard-disabled output
        run: |
          set -euo pipefail
          test "$(aws cloudformation describe-stacks --stack-name afl-app-dev-google-video --query 'Stacks[0].StackStatus' --output text)" = CREATE_COMPLETE
          test "$(aws cloudformation describe-stacks --stack-name afl-app-dev-google-video --query 'Stacks[0].Outputs[?OutputKey==`PaidGenerationMode`].OutputValue | [0]' --output text)" = DISABLED
          aws cloudformation describe-stacks --stack-name afl-app-dev-google-video --query 'Stacks[0].Outputs' --output table
          echo 'Stage 5A adapter deployed DISABLED. No Google video model called.'
