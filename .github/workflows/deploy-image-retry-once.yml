name: One-time deploy image retry with strict resource guards
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-image-retry-once.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: afl-dev-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install validation dependencies
        run: python -m pip install --disable-pip-version-check 'boto3>=1.35,<2' 'cfn-lint>=1,<2'
      - name: Validate CFN, code, and browser (offline)
        run: |
          cfn-lint infrastructure/app/backend.yaml --regions ap-southeast-2
          python -m py_compile src/api/handler.py src/image_worker/handler.py src/image_worker/google_direct.py scripts/deploy_image_retry_once.py
          node --test tests/test_frontend_poll.cjs
      - name: Build deterministic immutable packages
        run: python scripts/build_release_artifacts.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
          role-session-name: afl-guarded-image-retry-deploy
      - name: Guarded preview, deployment and live verification (no paid Google calls)
        run: python scripts/deploy_image_retry_once.py
