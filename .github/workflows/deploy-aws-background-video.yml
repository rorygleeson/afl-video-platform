name: Deploy AWS-owned sequential AFL video progression (guarded)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/deploy_aws_background_video.py'
      - '.github/workflows/deploy-aws-background-video.yml'
      - 'infrastructure/app/video-sequence-events.yaml'
      - 'infrastructure/app/image-video-start-events.yaml'
      - 'src/api/handler.py'
      - 'frontend/app.js'
      - 'frontend/index.html'
permissions:
  contents: read
  id-token: write
concurrency:
  group: afl-dev-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ contains(github.event.head_commit.message, '[deploy-aws-background-video]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run offline event, API, retries, and progressive UI contract tests
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'boto3>=1.35,<2' 'cfn-lint>=1,<2'
          python3 -m py_compile scripts/deploy_aws_background_video.py src/api/handler.py
          node --check frontend/app.js
          cfn-lint infrastructure/app/video-sequence-events.yaml --regions ap-southeast-2
          cfn-lint infrastructure/app/image-video-start-events.yaml --regions ap-southeast-2
          python3 -m unittest discover -s tests -p 'test_aws_video_sequence.py' -v
          python3 -m unittest discover -s tests -p 'test_video_api_stage4.py' -v
          python3 -m unittest discover -s tests -p 'test_real_video_scene_retry.py' -v
          node --test tests/test_frontend_poll.cjs
      - name: Authenticate existing AWS deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
      - name: Deploy API with Scene 3-to-FFmpeg idempotent handoff; preserve EventBridge and frontend
        run: python3 -u scripts/deploy_aws_background_video.py
