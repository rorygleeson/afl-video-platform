name: Deploy Google Omni item 4 HTTP diagnostics (guarded)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/deploy_google_http_diagnostics.py'
      - '.github/workflows/google-http-diagnostics.yml'
      - 'docs/GOOGLE_OMNI_RELIABILITY_CHECKLIST.md'
permissions:
  contents: read
  id-token: write
concurrency:
  group: afl-dev-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ contains(github.event.head_commit.message, '[deploy-google-http-item4]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test HTTP error handling with no paid model requests
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'boto3>=1.35,<2'
          python3 -m py_compile src/google_video_worker/handler.py scripts/deploy_google_http_diagnostics.py
          python3 -m unittest discover -s tests -p 'test_google_http_diagnostics.py' -v
          python3 -m unittest discover -s tests -p 'test_google_failure_audit.py' -v
          python3 -m unittest discover -s tests -p 'test_google_video_stage5a.py' -v
      - name: Authenticate existing AWS deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
      - name: Guarded worker-code-only CloudFormation release and verification
        run: python3 -u scripts/deploy_google_http_diagnostics.py
