name: One-time Vertex image migration live preflight (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/image-migration-live-preflight.yml'
permissions:
  contents: read
  id-token: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted main workflow
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Fetch only proposed backend template for semantic diff
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin feature/direct-vertex-nano-banana-pro
          git show FETCH_HEAD:infrastructure/app/backend.yaml > /tmp/afl-proposed-backend.yaml
      - name: Install YAML reader for audit
        run: python3 -m pip install --disable-pip-version-check 'PyYAML>=6,<7'
      - name: Configure existing AWS OIDC role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
          role-session-name: afl-image-migration-preflight
      - name: Inspect only existing resource metadata
        shell: bash
        run: |
          python3 - <<'PY'
          import boto3, json, hashlib, sys
          r = "ap-southeast-2"
          cf = boto3.client("cloudformation", region_name=r)
          lam = boto3.client("lambda", region_name=r)
          states = boto3.client("stepfunctions", region_name=r)
          s3 = boto3.client("s3", region_name=r)
          stack = cf.describe_stacks(StackName="afl-app-dev-backend")["Stacks"][0]
          params = {p["ParameterKey"]: p.get("ParameterValue") for p in stack.get("Parameters", [])}
          fn = lam.get_function_configuration(FunctionName="afl-app-dev-image-worker")
          workflow = states.describe_state_machine(stateMachineArn="arn:aws:states:ap-southeast-2:134387458447:stateMachine:afl-app-dev-scene1-pilot")
          details = json.loads(workflow["definition"])
          step = details["States"]["ParallelScenes"]
          try:
              active_count = len(states.list_executions(stateMachineArn=workflow["stateMachineArn"],statusFilter="RUNNING",maxResults=20)["executions"])
          except Exception as exc:
              if getattr(exc, "response", {}).get("Error", {}).get("Code") not in ("AccessDenied", "AccessDeniedException"):
                  raise
              active_count = "UNVERIFIED_DEPLOY_ROLE_MISSING_LIST_EXECUTIONS"
          asset_bucket = params.get("ScenarioAssetsBucket", "afl-video-bootstrap-artifactbucket-xiuriidgyft4")
          config_key = "scenarios/afl-grand-final-winning-kick/v1/config.json"
          obj = s3.get_object(Bucket=asset_bucket,Key=config_key)
          payload = obj["Body"].read(200000)
          if len(payload) >= 200000:
              raise RuntimeError("Scenario config unexpectedly large")
          config = json.loads(payload)
          result = {
              "stack_status":stack["StackStatus"],
              "stack_id_matches_expected": stack["StackId"].split("/")[1] == "afl-app-dev-backend",
              "image_lambda_runtime":fn.get("Runtime"),
              "image_lambda_status":fn.get("State"),
              "image_lambda_last_update":fn.get("LastUpdateStatus"),
              "image_lambda_timeout":fn.get("Timeout"),
              "image_lambda_memory":fn.get("MemorySize"),
              "image_lambda_role":fn.get("Role"),
              "image_lambda_code_sha256":fn.get("CodeSha256"),
              "image_lambda_has_replicate_secret":bool(fn.get("Environment",{}).get("Variables",{}).get("REPLICATE_SECRET_NAME")),
              "state_machine_status":workflow["status"],
              "state_machine_sha256":hashlib.sha256(workflow["definition"].encode()).hexdigest(),
              "parallel_scene_concurrency":step["MaxConcurrency"],
              "parallel_scene_start":step["ItemProcessor"]["StartAt"],
              "running_executions_first_20":active_count,
              "scenario_config_bucket":asset_bucket,
              "scenario_config_key":config_key,
              "scenario_config_version":obj.get("VersionId","unversioned"),
              "scenario_config_sha256":hashlib.sha256(payload).hexdigest(),
              "scenario_models":[x.get("model") for x in config.get("scenes",[])],
              "image_artifact_param":params.get("ImageWorkerArtifactKey"),
          }
          print("LIVE_IMAGE_MIGRATION_PREFLIGHT="+json.dumps(result,sort_keys=True))
          if stack["StackStatus"] != "UPDATE_COMPLETE" or fn.get("State")!="Active" or fn.get("LastUpdateStatus")!="Successful" or workflow["status"]!="ACTIVE":
              raise SystemExit("BLOCKED: live resources unhealthy")
          PY
      - name: Compare actual deployed template against proposed migration (NO WRITE)
        shell: bash
        run: |
          python3 - <<'PY'
          import boto3, json, yaml
          from pathlib import Path
          class Loader(yaml.SafeLoader): pass
          def intrinsic(loader, suffix, node):
              if isinstance(node, yaml.ScalarNode): value=loader.construct_scalar(node)
              elif isinstance(node, yaml.SequenceNode): value=loader.construct_sequence(node,deep=True)
              else: value=loader.construct_mapping(node,deep=True)
              return {("Ref" if suffix == "Ref" else "Fn::"+suffix): value}
          Loader.add_multi_constructor("!",intrinsic)
          cf=boto3.client("cloudformation",region_name="ap-southeast-2")
          live=cf.get_template(StackName="afl-app-dev-backend",TemplateStage="Original")["TemplateBody"]
          if isinstance(live,str): live=yaml.load(live,Loader=Loader)
          candidate=yaml.load(Path("/tmp/afl-proposed-backend.yaml").read_text(),Loader=Loader)
          old=live.get("Resources",{})
          new=candidate.get("Resources",{})
          added=sorted(set(new)-set(old))
          removed=sorted(set(old)-set(new))
          changed=sorted(k for k in old.keys() & new.keys() if old[k]!=new[k])
          out={"resource_count_live":len(old),"resource_count_proposed":len(new),
               "added":added,"removed":removed,"changed":changed,
               "image_only":not added and not removed and set(changed)<={"ImageWorkerLambda","ImageWorkerRole","ImageStateMachine"},
               "parameters_match":live.get("Parameters")==candidate.get("Parameters")}
          print("LIVE_TEMPLATE_VS_PR39="+json.dumps(out,sort_keys=True))
          if not out["image_only"]:
              print("BLOCKED: repository template has unrelated live CloudFormation changes")
          PY
      - name: Probe alternative read-only active-job signals (no mutation)
        shell: bash
        run: |
          python3 - <<'PY'
          import boto3,json,datetime
          r="ap-southeast-2"
          cw=boto3.client("cloudwatch",region_name=r)
          l=boto3.client("lambda",region_name=r)
          logs=boto3.client("logs",region_name=r)
          probes={}
          try:
              l.invoke(FunctionName="afl-app-dev-image-worker",InvocationType="DryRun")
              probes["lambda_invoke_dry_run"]="ALLOWED"
          except Exception as e:
              probes["lambda_invoke_dry_run"]="DENIED:"+getattr(e,"response",{}).get("Error",{}).get("Code",type(e).__name__)
          try:
              end=datetime.datetime.now(datetime.timezone.utc)
              start=end-datetime.timedelta(minutes=60)
              resp=cw.get_metric_statistics(Namespace="AWS/States",MetricName="OpenExecutionCount",
                  Dimensions=[{"Name":"StateMachineArn","Value":"arn:aws:states:ap-southeast-2:134387458447:stateMachine:afl-app-dev-scene1-pilot"}],
                  StartTime=start,EndTime=end,Period=300,Statistics=["Maximum"])
              probes["open_execution_metric"]={"allowed":True,"datapoints":resp.get("Datapoints",[])}
          except Exception as e:
              probes["open_execution_metric"]="DENIED:"+getattr(e,"response",{}).get("Error",{}).get("Code",type(e).__name__)
          try:
              resp=logs.describe_log_streams(logGroupName="/aws/vendedlogs/states/afl-app-dev-scene1-pilot",orderBy="LastEventTime",descending=True,limit=1)
              probes["image_sfn_log_streams"]="ALLOWED"
          except Exception as e:
              probes["image_sfn_log_streams"]="DENIED:"+getattr(e,"response",{}).get("Error",{}).get("Code",type(e).__name__)
          print("IMAGE_READ_ACCESS_PROBE="+json.dumps(probes,default=str))
          PY
