name: Audit live selfie S3 upload configuration (read-only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-live-s3-upload-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
      - name: Read only live CloudFormation and S3 settings
        shell: bash
        run: |
          python3 - <<'PY'
          import boto3,json
          region='ap-southeast-2'
          account='134387458447'
          session=boto3.Session(region_name=region)
          assert session.client('sts').get_caller_identity()['Account']==account
          cf=session.client('cloudformation')
          frontend=cf.describe_stacks(StackName='afl-app-dev-frontend')['Stacks'][0]
          backend=cf.describe_stacks(StackName='afl-app-dev-backend')['Stacks'][0]
          outputs={x['OutputKey']:x['OutputValue'] for x in frontend['Outputs']}
          params={x['ParameterKey']:x['ParameterValue'] for x in backend['Parameters']}
          expected=outputs['FrontendUrl'].rstrip('/')
          actual=params.get('FrontendOrigin','').rstrip('/')
          bucket=f'afl-app-dev-uploads-{account}-{region}'
          s3=session.client('s3')
          info={'frontend_url':expected,'backend_cors_frontend_origin':actual,
                'origins_match':expected==actual,
                'bucket_region':s3.get_bucket_location(Bucket=bucket)['LocationConstraint']}
          try:
            cors=s3.get_bucket_cors(Bucket=bucket)
            rules=cors.get('CORSRules',[])
            info['cors_rules']=[{'AllowedOrigins':r.get('AllowedOrigins',[]),
              'AllowedMethods':r.get('AllowedMethods',[]),
              'AllowedHeaders':r.get('AllowedHeaders',[]),
              'MaxAgeSeconds':r.get('MaxAgeSeconds')} for r in rules]
            info['cors_allows_frontend_post']=any(
              expected in r.get('AllowedOrigins',[]) and 'POST' in r.get('AllowedMethods',[])
              for r in rules)
          except Exception as exc:
            info['cors_read_error']=type(exc).__name__+': '+str(exc)
          print('READ_ONLY_UPLOAD_AUDIT='+json.dumps(info,sort_keys=True))
          PY
