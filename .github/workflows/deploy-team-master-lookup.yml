name: Deploy team-specific master image lookup (image worker only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-team-master-lookup.yml'
      - 'scripts/deploy_team_master_lookup.py'
permissions:
  contents: read
  id-token: write
concurrency:
  group: afl-dev-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: ${{ contains(github.event.head_commit.message, '[deploy-team-master-lookup]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate team-folder config, no frontend edits, compile worker
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile src/image_worker/handler.py src/image_worker/google_direct.py scripts/deploy_team_master_lookup.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          base=Path('scenarios/afl-grand-final-winning-kick/v1')
          cfg=json.loads((base/'config.json').read_text())
          assert set(cfg['teamGuernseys']) == {p.name for p in (base/'teams').iterdir() if p.is_dir()}
          assert len(cfg['teamGuernseys']) == 18
          assert all((base/'teams'/team/'README.md').is_file() for team in cfg['teamGuernseys'])
          collingwood = sorted((base/'teams'/'collingwood').glob('scene*-start.png'))
          assert [p.name for p in collingwood] == [f'scene{i}-start.png' for i in range(1, 4)]
          assert not any((base/'teams'/team/f'scene{i}-start.png').exists()
                         for team in cfg['teamGuernseys'] if team != 'collingwood'
                         for i in range(1, 4))
          assert all(100 <= len(s['identityOnlyInstructions']) <= 5000 for s in cfg['scenes'])
          image=Path('src/image_worker/handler.py').read_text()
          worker=Path('src/image_worker/google_direct.py').read_text()
          assert 'team_master_keys(config, item["team"])' in image
          assert 'teamMasterKeys' in image and 'teamMasterKeys' in worker
          assert 'identityOnlyPrompt' in image and 'identityOnlyInstructions' in image
          assert 'scene["masterKey"]' not in worker
          assert 'teamArtworkReady' not in image+worker
          assert 'config["sharedPrompt"]' not in image
          assert 'team_master_keys' in image and 'Team master artwork incomplete' in image
          assert 'sharedPrompt' not in cfg
          assert all('promptInstructions' not in scene and 'masterKey' not in scene
                     for scene in cfg['scenes'])
          print('TEAM_LOOKUP_OFFLINE_CHECKS_PASS')
          PY
      - name: Install AWS SDK
        run: python3 -m pip install --disable-pip-version-check 'boto3>=1.35,<2'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
      - name: Guarded CloudFormation deployment of image worker only
        run: python3 -u scripts/deploy_team_master_lookup.py
