name: ONE TIME image provider cutover - approved 2026-11-11
# Retry after verified rollback; fixes Map concurrency verification and Google STS form fields.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-image-cutover.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: afl-dev-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout approved deployment tooling
        uses: actions/checkout@v4
      - name: Fetch pinned approved image candidate and build immutable ZIP
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 526cd2c4b3f01d04654b98bd6ad1f69abb87350d
          test "$(git rev-parse FETCH_HEAD)" = 526cd2c4b3f01d04654b98bd6ad1f69abb87350d
          git worktree add --detach /tmp/image-migration FETCH_HEAD
          python3 /tmp/image-migration/scripts/build_release_artifacts.py > /dev/null
          python3 -m py_compile scripts/run_image_cutover.py
      - name: Assume existing approved AWS deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
          role-session-name: afl-approved-image-cutover
      - name: Image worker only - verify idle, preview, deploy and verify
        env:
          IMAGE_MIGRATION_APPROVED: CUTOVER_GOOGLE_IMAGE_ONLY
        run: python3 scripts/run_image_cutover.py
      - name: Preserve cutover and rollback report (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: approved-image-cutover-${{ github.run_id }}
          path: |
            image-cutover-report.json
            image-cutover-original-backend.yaml
          if-no-files-found: warn
          retention-days: 30
