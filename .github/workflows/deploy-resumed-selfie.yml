name: Deploy safe resume selfie preview (API and UI only)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-resumed-selfie.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: afl-dev-deploy
  cancel-in-progress: false
jobs:
  guarded-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate API-only selfie contract and frontend recovery
        run: |
          set -euo pipefail
          python -m py_compile src/api/handler.py scripts/deploy_overall_job_progress.py
          python -m unittest discover -s tests -p 'test_overall_job_progress.py' -v
          node --check frontend/app.js
          node --test tests/test_frontend_poll.cjs
          grep -q 'def selfie_for_job(job):' src/api/handler.py
          grep -q 'finalVideoReady' frontend/app.js
          grep -q 'id="savedSelfieNote"' frontend/index.html
          python scripts/check_deployment_ownership.py --enforce
      - name: Install AWS SDK
        run: python -m pip install --disable-pip-version-check 'boto3>=1.35,<2'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
          role-session-name: deploy-safe-resume
      - name: Deploy only changed API Lambda artifact and existing frontend JS/HTML
        env:
          DEPLOY_PROGRESS_CHANGE: DEPLOY_JOB_PROGRESS_ONLY
        run: python -u scripts/deploy_overall_job_progress.py
