name: Deploy isolated AFL video mock stack (Stage 3)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-video.yml'
      - 'infrastructure/app/video.yaml'
      - 'src/video_mock_worker/**'
      - 'tests/test_video_mock_stage3.py'
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: afl-video-stage3
  cancel-in-progress: false
jobs:
  validate-and-deploy-video-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mock pipeline validation tools
        run: python -m pip install --disable-pip-version-check 'boto3>=1.35,<2' 'cfn-lint>=1,<2'
      - name: Validate new video stack and mock worker
        run: |
          set -euo pipefail
          cfn-lint infrastructure/app/video.yaml --regions ap-southeast-2
          python -m py_compile src/video_mock_worker/handler.py
          python -m unittest discover -s tests -p 'test_video_mock_stage3.py' -v
          # Hard stop on any accidental provider-call code path.
          ! grep -RE 'aiplatform.googleapis.com|generativelanguage.googleapis.com|google\.genai|replicate\.com' src/video_mock_worker/
      - name: Assume existing deployment role on main via GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
      - name: Check identity and verify new-only target
        run: |
          set -euo pipefail
          aws sts get-caller-identity
          # Stage 3 creates a new stack only. Never update an existing video stack here.
          if aws cloudformation describe-stacks --stack-name afl-app-dev-video --region ap-southeast-2 >/dev/null 2>&1; then
            echo "Stack already exists; Stage 3 isolated create-only flow will not modify it."
            exit 1
          fi
      - name: Package and upload MOCK-ONLY video worker
        run: |
          set -euo pipefail
          mkdir -p dist/video-mock-worker
          cp src/video_mock_worker/handler.py dist/video-mock-worker/handler.py
          (cd dist/video-mock-worker && zip -q ../video-mock-worker.zip handler.py)
          aws s3 cp dist/video-mock-worker.zip "s3://afl-video-bootstrap-artifactbucket-xiuriidgyft4/video-mock-worker/$GITHUB_SHA.zip" --region ap-southeast-2
      - name: Deploy ONLY the new video stack
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --region ap-southeast-2 \
            --stack-name afl-app-dev-video \
            --template-file infrastructure/app/video.yaml \
            --parameter-overrides \
              ArtifactBucketName=afl-video-bootstrap-artifactbucket-xiuriidgyft4 \
              VideoMockWorkerArtifactKey=video-mock-worker/$GITHUB_SHA.zip \
              UploadsBucketName=afl-app-dev-uploads-134387458447-ap-southeast-2 \
              JobsTableName=afl-app-dev-jobs \
              PermissionsBoundaryArn=arn:aws:iam::134387458447:policy/afl-video-app-permissions-boundary \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn arn:aws:iam::134387458447:role/afl-video-cfn-execution-role
      - name: Verify mock-only resource configuration
        run: |
          set -euo pipefail
          aws lambda get-function-configuration --function-name afl-app-dev-video-mock-worker --query '{name:FunctionName,mode:Environment.Variables.MODE,role:Role}' --output json
          test "$(aws lambda get-function-configuration --function-name afl-app-dev-video-mock-worker --query 'Environment.Variables.MODE' --output text)" = "MOCK_ONLY"
          aws stepfunctions describe-state-machine --state-machine-arn "$(aws cloudformation describe-stacks --stack-name afl-app-dev-video --query 'Stacks[0].Outputs[?OutputKey==`VideoStateMachineArn`].OutputValue | [0]' --output text)" --query '{name:name,status:status}' --output json
          echo "Stage 3 mock infrastructure deployed. No production/API/image resources updated. No paid calls made."
