name: Sync AFL video prompts to S3 (no paid generation)

on:
  push:
    branches: [main]
    paths:
      - 'scenarios/afl-grand-final-winning-kick/v1/video/**'
      - '.github/workflows/sync-video-prompts.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: afl-dev-video-prompt-sync
  cancel-in-progress: false

jobs:
  sync-prompts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate scene configuration and prompt variables locally
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_video_prompts.py' -v
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path('scenarios/afl-grand-final-winning-kick/v1/video')
          config=json.loads((folder/'config.json').read_text())
          assert config['model']=='gemini-omni-1.2-flash'
          assert [(s['id'],s['durationSeconds']) for s in config['scenes']] == [('scene1',8),('scene2',8),('scene3',10)]
          for scene in config['scenes']:
              p=folder/scene['template']
              assert p.is_file() and p.stat().st_size > 1000
              assert p.stat().st_size < 12000
          print('Local prompt files and durations verified; no generation requested.')
          PY

      - name: Assume existing AWS deployment role through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2

      - name: Upload and byte-verify 3 video prompts and commentary configuration
        run: |
          set -euo pipefail
          bucket=$(aws cloudformation describe-stacks --stack-name afl-app-dev-google-video \
            --query 'Stacks[0].Parameters[?ParameterKey==`ScenarioAssetBucketName`].ParameterValue | [0]' --output text)
          test -n "$bucket" && test "$bucket" != None
          prefix=scenarios/afl-grand-final-winning-kick/v1/video
          for file in config.json scene1-video.txt scene2-video.txt scene3-video.txt; do
            case "$file" in
              config.json) content_type=application/json ;;
              *) content_type='text/plain; charset=utf-8' ;;
            esac
            aws s3 cp "$prefix/$file" "s3://$bucket/$prefix/$file" --content-type "$content_type"
            aws s3api get-object --bucket "$bucket" --key "$prefix/$file" "/tmp/verified-$file" > /dev/null
            cmp "$prefix/$file" "/tmp/verified-$file"
            echo "VERIFIED: s3://$bucket/$prefix/$file"
          done
          echo "All four S3 objects match this commit exactly. No paid video generation occurred."
