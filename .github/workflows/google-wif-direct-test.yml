name: Direct free Google IAM diagnostic (no CloudFormation callback)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/google-wif-direct-test.yml
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  safe-direct-wif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate that diagnostic cannot generate videos
        run: |
          set -euo pipefail
          python -m pip install 'cfn-lint>=1,<2'
          cfn-lint infrastructure/app/google-wif-direct-preflight.yaml --regions ap-southeast-2
          python -m py_compile tests/aws_google_wif_preflight/handler.py tests/aws_google_wif_preflight/direct.py
          ! grep -RE 'aiplatform.googleapis.com|generativelanguage.googleapis.com|gemini-omni-1.2-flash' tests/aws_google_wif_preflight/
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
      - name: Verify main video adapter remains locked
        run: |
          set -euo pipefail
          test "$(aws cloudformation describe-stacks --stack-name afl-app-dev-google-video --query 'Stacks[0].Outputs[?OutputKey==`PaidGenerationMode`].OutputValue | [0]' --output text)" = DISABLED
      - name: Package direct role-auth test
        run: |
          set -euo pipefail
          mkdir -p dist/wif-direct
          python -m pip install --target dist/wif-direct --platform manylinux2014_x86_64 --python-version 3.13 --implementation cp --abi cp313 --only-binary=:all: 'google-auth[requests]>=2.30,<3'
          cp tests/aws_google_wif_preflight/handler.py tests/aws_google_wif_preflight/direct.py dist/wif-direct/
          (cd dist/wif-direct && zip -q -r ../wif-direct.zip .)
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/wif-direct.zip') as z:
              names=set(z.namelist())
              assert 'direct.py' in names and 'handler.py' in names
              assert any('_cffi_backend' in x and 'cpython-313' in x for x in names), 'Missing Python 3.13 cffi binary'
              print('AWS Lambda Python 3.13 cffi dependency included')
          PY
          aws s3 cp dist/wif-direct.zip "s3://afl-video-bootstrap-artifactbucket-xiuriidgyft4/google-wif-direct/$GITHUB_SHA.zip"
      - name: Create temporary direct Lambda and role-specific invoke permission
        run: |
          set -euo pipefail
          aws cloudformation deploy --stack-name afl-app-dev-google-wif-direct-probe --template-file infrastructure/app/google-wif-direct-preflight.yaml --parameter-overrides ArtifactBucketName=afl-video-bootstrap-artifactbucket-xiuriidgyft4 PreflightArtifactKey=google-wif-direct/$GITHUB_SHA.zip --capabilities CAPABILITY_NAMED_IAM --role-arn arn:aws:iam::134387458447:role/afl-video-cfn-execution-role
      - name: Invoke token-exchange-only diagnostic and print safe result
        run: |
          set -euo pipefail
          echo 'Only op=auth_check is permitted; no model calls or video generation.'
          aws lambda invoke --function-name afl-app-dev-google-wif-direct-probe --cli-binary-format raw-in-base64-out --payload '{"op":"auth_check"}' /tmp/wif-result.json --query '{StatusCode:StatusCode,FunctionError:FunctionError}' --output json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/wif-result.json'))
          if isinstance(data, dict) and not data.get('status') and data.get('errorType'):
              print('Lambda runtime error type:', str(data['errorType'])[:100])
              message=str(data.get('errorMessage',''))
              # Print only safe import/runtime errors, not Google service exception contents.
              if any(x in message for x in ('Unable to import module','No module named','Handler not found')):
                  print('Import failure:', message[:200])
              raise SystemExit('Runtime error occurred before a usable auth result')
          print('Google new-worker WIF status:', data.get('status'))
          print('Google new-worker WIF error code:', data.get('errorCode'))
          print('Safe exception class:', data.get('errorType'))
          print('Sanitized failure flags:', data.get('diagnostics', {}))
          print('Allowlisted OAuth error categories:', data.get('safeOauthCodes', []))
          assert data.get('status') in ('AUTHENTICATED','AUTHENTICATION_FAILED')
          PY
      - name: Delete one-time WIF probe and its temporary invoke permission
        if: always()
        run: |
          set +e
          aws cloudformation delete-stack --stack-name afl-app-dev-google-wif-direct-probe
          aws cloudformation wait stack-delete-complete --stack-name afl-app-dev-google-wif-direct-probe
