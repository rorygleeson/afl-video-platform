name: Free Google WIF preflight v2 with bounded timeouts
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/google-wif-preflight-v2.yml
      - infrastructure/app/google-wif-preflight-v2.yaml
      - tests/aws_google_wif_preflight/**
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate strict no-paid auth probe
        run: |
          set -euo pipefail
          python -m pip install 'cfn-lint>=1,<2'
          cfn-lint infrastructure/app/google-wif-preflight-v2.yaml --regions ap-southeast-2
          python -m py_compile tests/aws_google_wif_preflight/handler.py
          ! grep -Ei 'aiplatform.googleapis.com|generativelanguage.googleapis.com|gemini-omni-1.2-flash' tests/aws_google_wif_preflight/handler.py
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
      - name: Confirm adapter locked, v2 preflight absent
        run: |
          set -euo pipefail
          test "$(aws cloudformation describe-stacks --stack-name afl-app-dev-google-video --query 'Stacks[0].Outputs[?OutputKey==`PaidGenerationMode`].OutputValue | [0]' --output text)" = DISABLED
          if aws cloudformation describe-stacks --stack-name afl-app-dev-google-wif-preflight-v2 >/dev/null 2>&1; then
            echo "v2 stack exists; refusing overwrite."
            exit 1
          fi
      - name: Bundle Python auth dependencies and probe
        run: |
          set -euo pipefail
          mkdir -p dist/preflight-v2
          python -m pip install --target dist/preflight-v2 'google-auth[requests]>=2.30,<3'
          cp tests/aws_google_wif_preflight/handler.py dist/preflight-v2/handler.py
          (cd dist/preflight-v2 && zip -q -r ../preflight-v2.zip .)
          aws s3 cp dist/preflight-v2.zip "s3://afl-video-bootstrap-artifactbucket-xiuriidgyft4/google-wif-preflight-v2/$GITHUB_SHA.zip"
      - name: Run real free new-role Google WIF probe
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name afl-app-dev-google-wif-preflight-v2 \
            --template-file infrastructure/app/google-wif-preflight-v2.yaml \
            --parameter-overrides ArtifactBucketName=afl-video-bootstrap-artifactbucket-xiuriidgyft4 PreflightArtifactKey=google-wif-preflight-v2/$GITHUB_SHA.zip \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn arn:aws:iam::134387458447:role/afl-video-cfn-execution-role
      - name: Display safe auth status and error code
        if: always()
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks --stack-name afl-app-dev-google-wif-preflight-v2 --query 'Stacks[0].{Status:StackStatus,Outputs:Outputs}' --output json || true
          aws cloudformation describe-stack-events --stack-name afl-app-dev-google-wif-preflight-v2 --query 'StackEvents[0:8].{Resource:LogicalResourceId,Status:ResourceStatus,Reason:ResourceStatusReason}' --output json || true
