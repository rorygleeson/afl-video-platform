name: Unified release (baseline / preview / controlled deployment)
on:
  push:
    branches: [main]
    paths:
      - 'scripts/preview_release_change_set.py'
      - 'scripts/validate_change_set.py'
      - '.github/workflows/release.yml'
      - 'scripts/plan_release.py'
      - 'scripts/execute_release_change_set.py'
  workflow_dispatch:
    inputs:
      change_set_preview:
        description: 'Release mode (deploy_backend can update AWS)'
        required: true
        type: choice
        default: offline
        options:
          - offline
          - backend
          - google
          - deploy_backend
      reviewed_preview_run_id:
        description: 'deploy_backend only: successful separately reviewed backend preview run ID from same commit'
        required: false
        type: string
      deployment_confirmation:
        description: 'For deploy_backend only, type DEPLOY_BACKEND to authorize an AWS update'
        required: false
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: afl-dev-deploy
  cancel-in-progress: false
jobs:
  baseline:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install AWS SDK for release audit
        run: python3 -m pip install --disable-pip-version-check 'boto3>=1.35,<2'
      - name: Test Google reconciliation offline
        run: python3 -m unittest discover -s tests -p 'test_google_reconciliation.py' -v
      - name: Validate ownership inventory
        run: python3 scripts/check_deployment_ownership.py
      - name: Verify source scripts compile
        run: python3 -m py_compile scripts/check_deployment_ownership.py scripts/capture_release_baseline.py scripts/build_release_artifacts.py scripts/plan_release.py scripts/publish_release_artifacts.py scripts/preview_release_change_set.py scripts/validate_change_set.py scripts/prepare_rollback.py scripts/verify_release_health.py scripts/verify_rollback_readiness.py scripts/execute_release_change_set.py scripts/verify_separate_preview_approval.py scripts/execute_backend_rollback.py scripts/prepare_google_reconciliation.py scripts/deploy_google_reconciliation.py
      - name: Build deterministic release artifacts
        run: |
          python3 scripts/build_release_artifacts.py
          cp dist/release/manifest.json /tmp/release-manifest.json
          python3 scripts/build_release_artifacts.py
          cmp /tmp/release-manifest.json dist/release/manifest.json
      - name: Verify immutable S3 keys and package integrity (no upload)
        run: python3 scripts/publish_release_artifacts.py --manifest dist/release/manifest.json
      - name: Upload immutable build manifest and packages for review
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-${{ github.run_id }}
          path: dist/release/
          retention-days: 14
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
      - name: Capture and verify live AWS release baseline
        env:
          BASELINE_OUTPUT: release-baseline.json
        run: python3 scripts/capture_release_baseline.py
      - name: Verify live resource health and protected Google code (read only)
        run: python3 scripts/verify_release_health.py --baseline release-baseline.json
      - name: Generate fail-closed offline release plan
        run: |
          python3 scripts/plan_release.py --baseline release-baseline.json --artifacts dist/release/manifest.json --output release-plan.json
      - name: Preflight CloudFormation preview parameters (no AWS writes)
        run: |
          for stack in backend google assembly frontend; do
            python3 scripts/preview_release_change_set.py --baseline release-baseline.json --plan release-plan.json --stack "$stack" --run-id "${{ github.run_id }}"
          done
      - name: Prepare isolated Google reconciliation plan (no AWS changes)
        if: ${{ inputs.change_set_preview == 'google' }}
        run: |
          python3 scripts/prepare_google_reconciliation.py --baseline release-baseline.json --output google-reconciliation-plan.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          plan=json.loads(Path("release-plan.json").read_text())
          fix=json.loads(Path("google-reconciliation-plan.json").read_text())
          if fix["verdict"] != "READY_FOR_SEPARATE_CHANGE_SET_PREVIEW":
              raise SystemExit("Google reconciliation not required; refusing update preview")
          target=plan["stacks"]["google"]
          target["proposed_parameters"]=fix["proposed_parameters"]
          target["changed_parameters"]=fix["changed_parameters"]
          Path("release-plan.json").write_text(json.dumps(plan,indent=2)+"\n")
          PY
      - name: Create and inspect isolated Google change set (preview only)
        if: ${{ inputs.change_set_preview == 'google' }}
        run: |
          python3 scripts/preview_release_change_set.py \
            --baseline release-baseline.json \
            --plan release-plan.json \
            --stack google \
            --run-id "${{ github.run_id }}" \
            --create-preview \
            --allow GoogleWorkerLambda
      - name: Upload Google preview result
        if: ${{ always() && inputs.change_set_preview == 'google' }}
        uses: actions/upload-artifact@v4
        with:
          name: google-preview-${{ github.run_id }}
          path: |
            google-reconciliation-plan.json
            change-set-preview.json
          if-no-files-found: warn
          retention-days: 30
      - name: Enforce manual backend deployment authorization
        if: ${{ inputs.change_set_preview == 'deploy_backend' }}
        env:
          CONFIRMATION: ${{ inputs.deployment_confirmation }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          test "$REF_NAME" = main && test "$REF_TYPE" = branch && test "$CONFIRMATION" = DEPLOY_BACKEND
      - name: Publish immutable release packages to S3 for approved deployment
        if: ${{ inputs.change_set_preview == 'deploy_backend' }}
        run: |
          python3 scripts/publish_release_artifacts.py --manifest dist/release/manifest.json --bucket afl-video-bootstrap-artifactbucket-xiuriidgyft4 --upload
      - name: Create and inspect backend change set
        if: ${{ inputs.change_set_preview == 'backend' || inputs.change_set_preview == 'deploy_backend' }}
        run: |
          python3 scripts/preview_release_change_set.py \
            --baseline release-baseline.json \
            --plan release-plan.json \
            --stack backend \
            --run-id "${{ github.run_id }}" \
            --create-preview \
            --allow ApiLambda \
            --allow ImageWorkerLambda \
            --allow VideoWorkerLambda \
            ${{ (inputs.change_set_preview == 'deploy_backend') && '--retain-reviewed' || '' }}
      - name: Upload CloudFormation preview result
        if: ${{ always() && (inputs.change_set_preview == 'backend' || inputs.change_set_preview == 'deploy_backend') }}
        uses: actions/upload-artifact@v4
        with:
          name: cfn-preview-${{ github.run_id }}
          path: change-set-preview.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish release plan for review
        uses: actions/upload-artifact@v4
        with:
          name: release-plan-${{ github.run_id }}
          path: release-plan.json
          retention-days: 14
      - name: Publish release baseline as restricted workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-baseline-${{ github.run_id }}
          path: release-baseline.json
          retention-days: 14
      - name: Capture and verify exact deployed rollback templates
        run: python3 scripts/prepare_rollback.py --baseline release-baseline.json --plan release-plan.json
      - name: Verify rollback recovery inputs against live AWS (read only)
        run: python3 scripts/verify_rollback_readiness.py --manifest rollback-manifest.json
      - name: Publish rollback inventory and deployed templates
        uses: actions/upload-artifact@v4
        with:
          name: rollback-evidence-${{ github.run_id }}
          path: |
            rollback-manifest.json
            dist/release/deployed-templates/
          retention-days: 30
      - name: Require separately reviewed exact same-commit CloudFormation preview
        if: ${{ inputs.change_set_preview == 'deploy_backend' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REVIEW_RUN_ID: ${{ inputs.reviewed_preview_run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          python3 scripts/verify_separate_preview_approval.py \
            --review-run-id "$REVIEW_RUN_ID" \
            --candidate change-set-preview.json \
            --head-sha "$HEAD_SHA"
      - name: Execute the exact validated backend change set (manual opt-in only)
        if: ${{ inputs.change_set_preview == 'deploy_backend' }}
        env:
          CONFIRMATION: ${{ inputs.deployment_confirmation }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_NAME" = main && test "$CONFIRMATION" = DEPLOY_BACKEND
          python3 - <<'PY'
          import json
          from pathlib import Path
          preview = json.loads(Path("change-set-preview.json").read_text())
          if preview.get("verdict") != "SAFE_PREVIEW" or not preview.get("retained_for_separate_approval"):
              raise SystemExit("No validated retained change set")
          change_set_id = preview["change_set_id"]
          import subprocess
          subprocess.run([
              "python3", "scripts/execute_release_change_set.py",
              "--baseline", "release-baseline.json",
              "--plan", "release-plan.json",
              "--change-set-id", change_set_id,
              "--approved-change-set-id", change_set_id,
              "--execute",
          ], check=True)
          PY
      - name: Wait for backend CloudFormation update
        if: ${{ inputs.change_set_preview == 'deploy_backend' }}
        run: aws cloudformation wait stack-update-complete --stack-name afl-app-dev-backend
      - name: Verify AWS health after backend update
        if: ${{ inputs.change_set_preview == 'deploy_backend' }}
        run: python3 scripts/verify_release_health.py --baseline release-baseline.json
      - name: Verify deployed backend Lambda code matches approved packages
        if: ${{ inputs.change_set_preview == 'deploy_backend' }}
        run: |
          python3 - <<'PY'
          import base64, boto3, json
          from pathlib import Path
          manifest=json.loads(Path("dist/release/manifest.json").read_text())["artifacts"]
          checks={"api":"ApiLambda", "image-worker":"ImageWorkerLambda", "legacy-video-worker":"VideoWorkerLambda"}
          cf=boto3.client("cloudformation",region_name="ap-southeast-2")
          lam=boto3.client("lambda",region_name="ap-southeast-2")
          for artifact, logical_id in checks.items():
              function=cf.describe_stack_resource(StackName="afl-app-dev-backend",LogicalResourceId=logical_id)["StackResourceDetail"]["PhysicalResourceId"]
              if artifact not in manifest:
                  raise SystemExit(f"FAIL: missing release manifest artifact {artifact}")
              expected=base64.b64encode(bytes.fromhex(manifest[artifact]["sha256_hex"])).decode()
              current=lam.get_function_configuration(FunctionName=function)
              if current.get("CodeSha256") != expected or current.get("State") != "Active" or current.get("LastUpdateStatus") != "Successful":
                  raise SystemExit(f"FAIL: {function} does not match the approved package or is not ready")
              print(f"PASS: {function} matches approved release ZIP")
          PY
      - name: Verify deployment workflow guardrails
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/release.yml').read_text()
          assert 'DEPLOY_BACKEND' in source
          assert 'scripts/execute_release_change_set.py' in source
          forbidden_command = 'aws cloudformation ' + 'deploy'
          assert forbidden_command not in source.lower()
          print('PASS: deployment requires explicit manual opt-in and exact-change-set executor')
          PY
      - name: Summary
        run: |
          echo '## Unified release result' >> "$GITHUB_STEP_SUMMARY"
          echo 'Offline mode makes no AWS changes. Backend and Google preview modes create and delete unexecuted CloudFormation change sets. deploy_backend retains a validated change set and executes it only with explicit confirmation.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Backend deployment only runs on explicit deploy_backend selection with DEPLOY_BACKEND confirmation. Google and assembly deployments remain disabled; legacy Google reconciliation is complete and is not rerun on push.' >> "$GITHUB_STEP_SUMMARY"


  deploy_google_timeouts:
    name: Deploy Google video timeouts (one-time, existing worker only)
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy-google-timeouts]')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate timeout-only source and no automatic retries
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source=Path("src/google_video_worker/handler.py").read_text()
          template=Path("infrastructure/app/google-video.yaml").read_text()
          assert 'with urllib.request.urlopen(req, timeout=150) as response:' in source
          assert "Timeout: 300" in template
          assert '"Retry"' not in template
          assert "timeout=75" not in source
          print("PASS: timeout-only release contract (300s Lambda, 150s Google socket, zero automatic retries).")
          PY
          python3 -m py_compile src/google_video_worker/handler.py
      - name: Install AWS SDK
        run: python3 -m pip install --disable-pip-version-check 'boto3>=1.35,<2'
      - name: Assume existing deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
          role-session-name: afl-google-timeouts-once
      - name: Preserve working Lambda dependencies and deploy 300/150-second timeout-only change
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import hashlib
          import io
          import os
          import time
          import zipfile
          import boto3
          from botocore.exceptions import ClientError

          FUNCTION="afl-app-dev-google-omni-worker"
          STACK="afl-app-dev-google-video"
          BUCKET="afl-video-bootstrap-artifactbucket-xiuriidgyft4"
          ORIGINAL_KEY="google-diagnostics/956c2a9faa7efb1f39ed1a8ecc376510ffb1ec34.zip"
          ORIGINAL_SHA="RKx1wcvmxcE3Sx7kzlxbTI3NhBlNlt/Ydpy6J4ZOpmI="
          lam=boto3.client("lambda",region_name="ap-southeast-2")
          cf=boto3.client("cloudformation",region_name="ap-southeast-2")
          s3=boto3.client("s3",region_name="ap-southeast-2")
          sts=boto3.client("sts",region_name="ap-southeast-2")
          identity=sts.get_caller_identity()
          assert identity["Account"]=="134387458447"
          assert ":assumed-role/afl-video-github-deploy-role/" in identity["Arn"]
          stack=cf.describe_stacks(StackName=STACK)["Stacks"][0]
          assert stack["StackStatus"]=="UPDATE_COMPLETE", "Google stack not stable"
          resource=cf.describe_stack_resource(StackName=STACK,LogicalResourceId="GoogleWorkerLambda")["StackResourceDetail"]
          assert resource["PhysicalResourceId"]==FUNCTION,"Unexpected Lambda identity"
          before=lam.get_function_configuration(FunctionName=FUNCTION)
          assert before["State"]=="Active" and before["LastUpdateStatus"]=="Successful"
          assert before["Timeout"]==180,"Unexpected current timeout; manual review required"
          assert before["CodeSha256"]==ORIGINAL_SHA,"Live code changed; refusing to overwrite"
          body=s3.get_object(Bucket=BUCKET,Key=ORIGINAL_KEY)["Body"].read()
          assert base64.b64encode(hashlib.sha256(body).digest()).decode()==ORIGINAL_SHA,"Backup ZIP mismatch"
          with zipfile.ZipFile(io.BytesIO(body)) as archive:
              assert archive.testzip() is None
              filenames=archive.namelist()
              assert filenames.count("handler.py")==1,"Unexpected archive layout"
              old_handler=archive.read("handler.py")
              assert old_handler.count(b"with urllib.request.urlopen(req, timeout=75) as response:")==1
              updated=old_handler.replace(
                  b"with urllib.request.urlopen(req, timeout=75) as response:",
                  b"with urllib.request.urlopen(req, timeout=150) as response:")
              assert updated!=old_handler
              local_source=open("src/google_video_worker/handler.py","rb").read()
              assert updated==local_source,"Repository worker contains additional divergence; stop"
              output=io.BytesIO()
              with zipfile.ZipFile(output,"w") as patched:
                  for member in archive.infolist():
                      content=updated if member.filename=="handler.py" else archive.read(member.filename)
                      patched.writestr(member,content)
          new_zip=output.getvalue()
          with zipfile.ZipFile(io.BytesIO(new_zip)) as check:
              assert check.testzip() is None
              assert check.read("handler.py")==updated
          new_sha=base64.b64encode(hashlib.sha256(new_zip).digest()).decode()
          print("PRECHECK_OK: live source, dependencies, original ZIP, and release diff verified")
          code_changed=False
          try:
              response=lam.update_function_code(FunctionName=FUNCTION,ZipFile=new_zip,
                                                 RevisionId=before["RevisionId"])
              code_changed=True
              lam.get_waiter("function_updated").wait(
                  FunctionName=FUNCTION,WaiterConfig={"Delay":5,"MaxAttempts":36})
              updated_config=lam.get_function_configuration(FunctionName=FUNCTION)
              assert updated_config["CodeSha256"]==new_sha
              lam.update_function_configuration(
                  FunctionName=FUNCTION,Timeout=300,RevisionId=updated_config["RevisionId"])
              lam.get_waiter("function_updated").wait(
                  FunctionName=FUNCTION,WaiterConfig={"Delay":5,"MaxAttempts":36})
              after=lam.get_function_configuration(FunctionName=FUNCTION)
              assert after["CodeSha256"]==new_sha and after["Timeout"]==300
              assert after["State"]=="Active" and after["LastUpdateStatus"]=="Successful"
              print("DEPLOYED_AND_VERIFIED: Lambda=300s Google_HTTP=150s; no Google POST or paid generation.")
              print("Google CloudFormation drift warning: deployed Lambda code/config must be reconciled before a future Google stack update.")
          except Exception:
              if code_changed:
                  print("Deployment or verification failed. Attempting rollback to original ZIP and 180s.")
                  try:
                      current=lam.get_function_configuration(FunctionName=FUNCTION)
                      if current.get("LastUpdateStatus")=="InProgress":
                          lam.get_waiter("function_updated").wait(FunctionName=FUNCTION)
                      lam.update_function_code(FunctionName=FUNCTION,ZipFile=body)
                      lam.get_waiter("function_updated").wait(FunctionName=FUNCTION)
                      current=lam.get_function_configuration(FunctionName=FUNCTION)
                      lam.update_function_configuration(FunctionName=FUNCTION,Timeout=180,
                                                        RevisionId=current["RevisionId"])
                      lam.get_waiter("function_updated").wait(FunctionName=FUNCTION)
                      rolled=lam.get_function_configuration(FunctionName=FUNCTION)
                      assert rolled["CodeSha256"]==ORIGINAL_SHA and rolled["Timeout"]==180
                      print("ROLLBACK_VERIFIED: restored original Lambda code and timeout.")
                  except Exception as rollback_error:
                      print("ROLLBACK_UNVERIFIED:",type(rollback_error).__name__)
              raise
          PY
