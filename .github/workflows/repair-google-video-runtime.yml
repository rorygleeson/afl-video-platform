name: Repair locked Omni worker Python 3.13 dependency packaging
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-google-video-runtime.yml
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: afl-google-video-runtime-repair
  cancel-in-progress: false
jobs:
  repair-locked-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate locked template and worker unit tests
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'boto3>=1.35,<2' 'cfn-lint>=1,<2'
          cfn-lint infrastructure/app/google-video.yaml --regions ap-southeast-2
          python -m unittest discover -s tests -p test_google_video_stage5a.py -v
          grep -q "PAID_GENERATION_ENABLED: 'false'" infrastructure/app/google-video.yaml
          grep -q "GOOGLE_VIDEO_MODEL: UNCONFIGURED" infrastructure/app/google-video.yaml
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
      - name: Confirm existing adapter hard-disabled before update
        run: |
          set -euo pipefail
          test "$(aws cloudformation describe-stacks --stack-name afl-app-dev-google-video --query 'Stacks[0].Outputs[?OutputKey==`PaidGenerationMode`].OutputValue | [0]' --output text)" = DISABLED
          test "$(aws cloudformation describe-stacks --stack-name afl-app-dev-google-video --query 'Stacks[0].StackStatus' --output text)" = CREATE_COMPLETE
      - name: Build Google auth for Linux Lambda Python 3.13
        run: |
          set -euo pipefail
          mkdir -p dist/google-video-runtime
          python -m pip install --target dist/google-video-runtime --platform manylinux2014_x86_64 --python-version 3.13 --implementation cp --abi cp313 --only-binary=:all: 'google-auth[requests]>=2.30,<3'
          cp src/google_video_worker/handler.py src/api/video_prompts.py dist/google-video-runtime/
          (cd dist/google-video-runtime && zip -q -r ../google-video-runtime.zip .)
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/google-video-runtime.zip') as z:
              names=set(z.namelist())
              assert 'handler.py' in names and 'video_prompts.py' in names
              assert any('_cffi_backend' in x and 'cpython-313' in x for x in names)
          PY
          aws s3 cp dist/google-video-runtime.zip "s3://afl-video-bootstrap-artifactbucket-xiuriidgyft4/google-video-runtime/$GITHUB_SHA.zip"
      - name: Update only isolated Google stack locked artifact parameter
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --stack-name afl-app-dev-google-video \
            --template-file infrastructure/app/google-video.yaml \
            --parameter-overrides \
              ArtifactBucketName=afl-video-bootstrap-artifactbucket-xiuriidgyft4 \
              GoogleWorkerArtifactKey=google-video-runtime/$GITHUB_SHA.zip \
              PermissionsBoundaryArn=arn:aws:iam::134387458447:policy/afl-video-app-permissions-boundary \
              UploadsBucketName=afl-app-dev-uploads-134387458447-ap-southeast-2 \
              JobsTableName=afl-app-dev-jobs \
              AdmissionTableName=afl-app-dev-video-admission \
              ScenarioAssetBucketName=afl-video-bootstrap-artifactbucket-xiuriidgyft4 \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn arn:aws:iam::134387458447:role/afl-video-cfn-execution-role
          test "$(aws cloudformation describe-stacks --stack-name afl-app-dev-google-video --query 'Stacks[0].Outputs[?OutputKey==`PaidGenerationMode`].OutputValue | [0]' --output text)" = DISABLED
          echo 'Omni worker Python 3.13 dependency package repaired. Paid model remains DISABLED.'
