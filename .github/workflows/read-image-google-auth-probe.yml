name: Read one-time Google image auth diagnostic (no paid requests)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/read-image-google-auth-probe.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: afl-dev-deploy
  cancel-in-progress: false
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Assume existing AWS deployment identity
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
          role-session-name: afl-read-google-image-auth-probe
      - name: Read sanitised authentication result from existing job table
        shell: bash
        run: |
          python3 - <<'PY'
          import boto3,time,json
          ddb=boto3.client("dynamodb",region_name="ap-southeast-2")
          for attempt in range(20):
              page=ddb.scan(
                  TableName="afl-app-dev-jobs",
                  FilterExpression="jobId = :id",
                  ExpressionAttributeValues={":id":{"S":"__google_image_auth_probe_after_iam_20261112"}},
                  ProjectionExpression="jobId, authDiagnosticCode, #status",
                  ExpressionAttributeNames={"#status":"status"})
              for item in page.get("Items",[]):
                  status=item.get("status",{}).get("S")
                  code=item.get("authDiagnosticCode",{}).get("S")
                  if status=="DIAGNOSTIC_COMPLETE" and code:
                      if not code.startswith("GOOGLE_AUTH_") or len(code)>80:
                          raise RuntimeError("Invalid diagnostic code")
                      print("GOOGLE_IMAGE_AUTH_PROBE_RESULT="+code)
                      raise SystemExit(0)
              if attempt<19:
                  time.sleep(20)
          raise SystemExit("NO_AUTH_PROBE_RESULT: scheduled image watchdog may not be running")
          PY
