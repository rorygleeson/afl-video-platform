name: One-time deploy sanitised Google image preparation diagnostics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/image-preparation-diagnostic-deploy.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: afl-dev-deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout controlled deployment tooling
        uses: actions/checkout@v4
      - name: Fetch pinned tested image worker package
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin bfc151f77c60463ac8891bab58142e0c901ba193
          test "$(git rev-parse FETCH_HEAD)" = bfc151f77c60463ac8891bab58142e0c901ba193
          git worktree add --detach /tmp/afl-image-diagnostic FETCH_HEAD
          python3 /tmp/afl-image-diagnostic/scripts/build_release_artifacts.py > /dev/null
          python3 -m py_compile scripts/deploy_image_diagnostic.py
      - name: Assume existing GitHub AWS deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
          role-session-name: afl-image-diagnostic-deploy
      - name: Controlled image worker code-only update
        env:
          IMAGE_DIAGNOSTIC_APPROVAL: DEPLOY_IMAGE_DIAGNOSTIC_ONLY
        run: python3 scripts/deploy_image_diagnostic.py
      - name: Preserve diagnostic update audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-diagnostic-deployment-${{ github.run_id }}
          path: image-diagnostic-deploy-report.json
          if-no-files-found: warn
          retention-days: 30
