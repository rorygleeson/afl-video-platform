name: Controlled backend rollback
on:
  workflow_dispatch:
    inputs:
      release_run_id:
        description: 'GitHub release workflow run ID containing rollback evidence and plan'
        required: true
        type: string
      confirmation:
        description: 'Type ROLLBACK_BACKEND to restore the saved backend release'
        required: true
        type: string
permissions:
  contents: read
  actions: read
  id-token: write
concurrency:
  group: afl-dev-deploy
  cancel-in-progress: false
jobs:
  rollback:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'ROLLBACK_BACKEND' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Check rollback inputs
        env:
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          [[ "$RELEASE_RUN_ID" =~ ^[0-9]+$ ]] && test "$CONFIRMATION" = ROLLBACK_BACKEND
          python3 -m py_compile scripts/execute_backend_rollback.py
      - name: Verify selected evidence belongs to a main-branch unified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          run_id=os.environ["RELEASE_RUN_ID"]
          if not run_id.isdigit():
              raise SystemExit("Release run ID must be numeric")
          result=subprocess.run(["gh", "api", f"repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{run_id}"],
                                check=True, capture_output=True, text=True)
          run=json.loads(result.stdout)
          if run.get("path") != ".github/workflows/release.yml" or run.get("head_branch") != "main" or run.get("event") != "workflow_dispatch":
              raise SystemExit("Evidence must originate from a manually dispatched main-branch release workflow")
          if run.get("status") != "completed":
              raise SystemExit("Release workflow has not finished")
          print("PASS: release evidence originates from expected workflow and branch")
          PY
      - name: Download saved rollback evidence from selected release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "rollback-evidence-$RELEASE_RUN_ID" --dir .
          gh run download "$RELEASE_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-plan-$RELEASE_RUN_ID" --dir .
      - name: Validate saved evidence before assuming AWS permissions
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("rollback-manifest.json").read_text())
          p=json.loads(Path("release-plan.json").read_text())
          assert m["region"] == "ap-southeast-2"
          assert m["rollback_executable"] is False
          assert m["stacks"]["backend"]["previous_parameters"] == p["stacks"]["backend"]["current_parameters"]
          assert Path(m["stacks"]["backend"]["template_path"]).is_file()
          print("PASS: saved rollback evidence and plan present")
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
      - name: Execute strictly validated backend rollback
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          python3 scripts/execute_backend_rollback.py --manifest rollback-manifest.json --plan release-plan.json --run-id "$GITHUB_RUN_ID" --confirmation "$CONFIRMATION"
