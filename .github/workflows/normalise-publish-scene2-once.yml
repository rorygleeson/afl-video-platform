name: One-time normalize and publish approved Scene 2 PNG
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/normalise-publish-scene2-once.yml'
  workflow_dispatch:
permissions:
  contents: write
  id-token: write
concurrency:
  group: afl-scenario-prompts-s3
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact approved main source
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install image validation tooling
        run: python3 -m pip install --disable-pip-version-check 'Pillow==12.1.1'
      - name: Check approved image and crop exactly to 9:16
        shell: bash
        run: |
          set -euo pipefail
          path="scenarios/afl-grand-final-winning-kick/v1/scene2-start.png"
          test "$(git hash-object "$path")" = "a3e0a2657ac60e12246db52c597daa6aa8b00883" || {
            echo "::error::Scene 2 source differs from user-approved PNG. Refusing to overwrite."
            exit 1
          }
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          path=Path("scenarios/afl-grand-final-winning-kick/v1/scene2-start.png")
          with Image.open(path) as raw:
              raw.load()
              assert raw.format=="PNG", "Source must be PNG"
              assert raw.size==(942, 1670), f"Unexpected source dimensions: {raw.size}"
              # Six-pixel centered crop to 936x1664, exactly 9:16.
              out=raw.crop((3,3,939,1667))
              assert out.size==(936,1664)
              assert out.width*16==out.height*9
              out.save(path,format="PNG",optimize=True)
          with Image.open(path) as check:
              check.verify()
          assert 100_000 <= path.stat().st_size <= 15_000_000
          print("SCENE2_IMAGE_VERIFIED=936x1664 exact 9:16 PNG")
          PY
      - name: Commit normalized file only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- scenarios/afl-grand-final-winning-kick/v1/scene2-start.png
          git diff --cached --name-only | grep -Fxq "scenarios/afl-grand-final-winning-kick/v1/scene2-start.png"
          test "$(git diff --cached --name-only | wc -l)" -eq 1
          git commit -m "assets(scene2): normalize user-approved image to exact 936x1664"
          git push origin HEAD:main
      - name: Assume existing AWS S3 publishing role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
          role-session-name: afl-scene2-png-publisher
      - name: Overwrite and byte-verify exact Scene 2 key in S3
        shell: bash
        run: |
          set -euo pipefail
          path="scenarios/afl-grand-final-winning-kick/v1/scene2-start.png"
          bucket="afl-video-bootstrap-artifactbucket-xiuriidgyft4"
          temp="$(mktemp)"
          trap 'rm -f "$temp"' EXIT
          aws s3 cp "$path" "s3://$bucket/$path" --region ap-southeast-2 --content-type image/png --cache-control no-store --only-show-errors
          aws s3 cp "s3://$bucket/$path" "$temp" --region ap-southeast-2 --only-show-errors
          cmp --silent "$path" "$temp" || {
            echo "::error::S3 bytes do not match approved GitHub image"
            exit 1
          }
          echo "SCENE2_S3_PUBLISHED_AND_VERIFIED=s3://$bucket/$path"
