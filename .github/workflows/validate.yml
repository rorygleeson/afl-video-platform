name: Validate infrastructure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CloudFormation linter
        run: python -m pip install --disable-pip-version-check 'cfn-lint>=1,<2'
      - name: Lint bootstrap CloudFormation template
        run: cfn-lint infrastructure/bootstrap/bootstrap.yaml --regions ap-southeast-2
