name: Validate infrastructure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cfn-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CloudFormation linter
        run: python -m pip install --disable-pip-version-check 'cfn-lint>=1,<2'
      - name: Lint all application CloudFormation templates
        run: cfn-lint infrastructure/bootstrap/bootstrap.yaml infrastructure/app/frontend.yaml infrastructure/app/backend.yaml --regions ap-southeast-2
      - name: Compile API handler
        run: python -m py_compile src/api/handler.py
      - name: Test regional SigV4 presigned uploads
        run: |
          python -m pip install --disable-pip-version-check boto3
          python -m unittest discover -s tests -p 'test_*.py' -v
