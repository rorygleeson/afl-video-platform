name: Validate infrastructure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full Git history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan commits for hardcoded secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
  cfn-lint:
    needs: secret-scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CloudFormation linter
        run: python -m pip install --disable-pip-version-check 'cfn-lint>=1,<2'
      - name: Lint all application CloudFormation templates
        run: cfn-lint infrastructure/bootstrap/bootstrap.yaml infrastructure/app/frontend.yaml infrastructure/app/backend.yaml --regions ap-southeast-2
      - name: Check application Python, JavaScript and scenario JSON syntax
        run: |
          python -m py_compile src/api/handler.py src/api/video_prompts.py src/image_worker/handler.py src/video_worker/handler.py src/google_video_worker/handler.py src/assembly_worker/handler.py scripts/audit_live_aws.py
          node --check frontend/app.js
          python -m json.tool scenarios/afl-grand-final-winning-kick/v1/config.json > /dev/null
      - name: Test browser polling and scene thumbnails
        run: node --test tests/test_frontend_poll.cjs
      - name: Test regional SigV4 presigned uploads
        run: |
          python -m pip install --disable-pip-version-check boto3
          python -m unittest discover -s tests -p 'test_*.py' -v
