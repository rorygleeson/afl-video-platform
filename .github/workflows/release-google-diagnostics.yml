name: Release Google diagnostics only
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-google-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: afl-google-diagnostics-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile and validate code before any AWS write
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile src/google_video_worker/handler.py src/api/handler.py src/api/video_prompts.py
          python3 - <<'PY'
          from pathlib import Path
          html = Path('frontend/index.html').read_text()
          assert '<script src="./config.js"></script>' in html
          assert '<script src="./app.js"></script>' in html
          assert '<link rel="stylesheet" href="./styles.css">' in html
          assert Path('frontend/app.js').stat().st_size > 0
          assert Path('frontend/styles.css').stat().st_size > 0
          worker = Path('src/google_video_worker/handler.py').read_text()
          diag = worker.split('def diagnose_failed_interaction(job, scene):')[1].split('def lambda_handler(event, context):')[0]
          assert 'google_json("POST"' not in diag
          assert 'google_json("GET"' in diag
          assert 'GOOGLE_RESPONSE_TOO_LARGE' in diag
          assert '"providerFinalStatus": state' in worker
          PY
          node --check frontend/app.js

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Build API and Google diagnostic Lambda packages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/api dist/google
          cp src/api/handler.py src/api/video_prompts.py dist/api/
          (cd dist/api && zip -q ../diagnostic-api.zip handler.py video_prompts.py)
          python3 -m pip install --disable-pip-version-check --no-cache-dir --target dist/google 'google-auth>=2.38,<3' 'requests>=2.31,<3'
          cp src/google_video_worker/handler.py src/api/video_prompts.py dist/google/
          (cd dist/google && zip -q -r ../diagnostic-google.zip .)
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          for p in [Path('dist/diagnostic-api.zip'), Path('dist/diagnostic-google.zip')]:
              with zipfile.ZipFile(p) as z:
                  assert {'handler.py', 'video_prompts.py'} <= set(z.namelist())
                  assert z.testzip() is None
          PY

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
          role-session-name: afl-google-diagnostic-release

      - name: Upload immutable Lambda artifacts
        shell: bash
        run: |
          set -euo pipefail
          bucket=afl-video-bootstrap-artifactbucket-xiuriidgyft4
          aws s3 cp dist/diagnostic-api.zip "s3://$bucket/api-diagnostics/$GITHUB_SHA.zip" --only-show-errors
          aws s3 cp dist/diagnostic-google.zip "s3://$bucket/google-diagnostics/$GITHUB_SHA.zip" --only-show-errors

      - name: Install CloudFormation inspection dependency
        run: python3 -m pip install --disable-pip-version-check 'boto3>=1.35,<2'

      - name: Resolve existing Lambda IDs without executing CloudFormation changes
        shell: bash
        env:
          CFN_ROLE: arn:aws:iam::134387458447:role/afl-video-cfn-execution-role
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import boto3, json, os
          from botocore.exceptions import WaiterError
          cf = boto3.client("cloudformation", region_name="ap-southeast-2")
          sha = os.environ["GITHUB_SHA"]
          plans = [
              ("afl-app-dev-backend", "LambdaArtifactKey", f"api-diagnostics/{sha}.zip", "ApiLambda"),
              ("afl-app-dev-google-video", "GoogleWorkerArtifactKey", f"google-diagnostics/{sha}.zip", "GoogleWorkerLambda"),
          ]
          resolved = []
          for stack, parameter, key, logical_id in plans:
              existing = cf.describe_stacks(StackName=stack)["Stacks"][0]
              if existing["StackStatus"] != "UPDATE_COMPLETE":
                  raise RuntimeError(f"{stack} not in UPDATE_COMPLETE; refusing code update")
              params = [
                  {"ParameterKey": p["ParameterKey"], **(
                      {"ParameterValue": key} if p["ParameterKey"] == parameter
                      else {"UsePreviousValue": True}
                  )}
                  for p in existing["Parameters"]
              ]
              if not any(p["ParameterKey"] == parameter for p in existing["Parameters"]):
                  raise RuntimeError(f"Missing {parameter} in {stack}")
              name = "afl-diagnostics-resolve-" + sha[:12]
              cf.create_change_set(
                  StackName=stack, ChangeSetName=name, ChangeSetType="UPDATE",
                  UsePreviousTemplate=True, Parameters=params,
                  RoleARN=os.environ["CFN_ROLE"], Capabilities=["CAPABILITY_NAMED_IAM"])
              try:
                  try:
                      cf.get_waiter("change_set_create_complete").wait(
                          StackName=stack, ChangeSetName=name,
                          WaiterConfig={"Delay": 5, "MaxAttempts": 48})
                  except WaiterError:
                      detail = cf.describe_change_set(StackName=stack, ChangeSetName=name)
                      raise RuntimeError(f"Cannot resolve {stack}: {detail['Status']} / {detail.get('StatusReason','')}")
                  detail = cf.describe_change_set(StackName=stack, ChangeSetName=name)
                  if detail.get("NextToken"):
                      raise RuntimeError("Paginated changeset; cannot safely resolve Lambda")
                  matches = [c["ResourceChange"] for c in detail["Changes"]
                             if c.get("ResourceChange", {}).get("LogicalResourceId") == logical_id]
                  if len(matches) != 1:
                      raise RuntimeError(f"Expected exactly one {logical_id} change in {stack}")
                  change = matches[0]
                  if (change.get("Action") != "Modify"
                      or change.get("ResourceType") != "AWS::Lambda::Function"
                      or change.get("Replacement") not in (False, "False")
                      or not change.get("PhysicalResourceId")):
                      raise RuntimeError(f"Unexpected Lambda change for {logical_id}")
                  details = change.get("Details", [])
                  if not details or any(d.get("Target", {}).get("Attribute") != "Properties"
                                        or d.get("Target", {}).get("Name") != "Code"
                                        or d.get("Target", {}).get("RequiresRecreation") != "Never"
                                        for d in details):
                      raise RuntimeError(f"Unexpected Lambda properties for {logical_id}")
                  resolved.append({"function": change["PhysicalResourceId"], "key": key})
              finally:
                  cf.delete_change_set(StackName=stack, ChangeSetName=name)
          with open("/tmp/diagnostic-lambdas.json", "w") as file:
              json.dump(resolved, file)
          print("Resolved two existing Lambda functions; no CloudFormation changes executed.")
          PY

      - name: Update only existing Lambda code and verify deployment
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import boto3, json
          s3_bucket = "afl-video-bootstrap-artifactbucket-xiuriidgyft4"
          lam = boto3.client("lambda", region_name="ap-southeast-2")
          with open("/tmp/diagnostic-lambdas.json") as file:
              targets = json.load(file)
          if len(targets) != 2 or len({x["function"] for x in targets}) != 2:
              raise RuntimeError("Expected two distinct existing Lambdas")
          # Code-only API call: never mutate Lambda configuration, IAM, or Step Functions.
          for target in targets:
              function = target["function"]
              before = lam.get_function_configuration(FunctionName=function)
              if before.get("State") != "Active" or before.get("LastUpdateStatus") != "Successful":
                  raise RuntimeError(f"{function} is not ready for a code-only update")
              response = lam.update_function_code(
                  FunctionName=function, S3Bucket=s3_bucket, S3Key=target["key"],
                  RevisionId=before["RevisionId"])
              lam.get_waiter("function_updated").wait(
                  FunctionName=function, WaiterConfig={"Delay": 5, "MaxAttempts": 60})
              after = lam.get_function_configuration(FunctionName=function)
              if after.get("LastUpdateStatus") != "Successful" or after.get("CodeSha256") != response.get("CodeSha256"):
                  raise RuntimeError(f"{function} code update verification failed")
              print(f"Verified code-only Lambda update: {function}")
          PY

      - name: Publish only frontend index and invalidate its cache
        shell: bash
        run: |
          set -euo pipefail
          bucket=$(aws cloudformation describe-stacks --stack-name afl-app-dev-frontend \
            --query "Stacks[0].Outputs[?OutputKey=='FrontendBucketName'].OutputValue | [0]" --output text)
          dist=$(aws cloudformation describe-stacks --stack-name afl-app-dev-frontend \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue | [0]" --output text)
          test -n "$bucket" && test "$bucket" != None
          test -n "$dist" && test "$dist" != None
          aws s3 cp frontend/styles.css "s3://$bucket/styles.css" \
            --content-type 'text/css; charset=utf-8' --cache-control 'max-age=60, must-revalidate' --only-show-errors
          aws s3 cp frontend/app.js "s3://$bucket/app.js" \
            --content-type 'application/javascript; charset=utf-8' --cache-control 'max-age=60, must-revalidate' --only-show-errors
          aws s3 cp frontend/index.html "s3://$bucket/index.html" \
            --content-type 'text/html; charset=utf-8' --cache-control 'max-age=60, must-revalidate' --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$dist" --paths /index.html /styles.css /app.js /
          echo "Diagnostics release complete. No paid POST, no Step Functions changes."
