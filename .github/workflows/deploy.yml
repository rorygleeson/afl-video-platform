name: Deploy AFL development frontend
on:
  push:
    branches: [deploy]
permissions:
  contents: read
  id-token: write
concurrency:
  group: afl-dev-deploy
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cfn-lint
        run: python -m pip install --disable-pip-version-check 'cfn-lint>=1,<2'
      - name: Validate CloudFormation
        run: cfn-lint infrastructure/bootstrap/bootstrap.yaml infrastructure/app/frontend.yaml --regions ap-southeast-2
      - name: Verify frontend file
        run: test -s frontend/index.html
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assume AFL deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
      - name: Verify caller
        run: aws sts get-caller-identity
      - name: Deploy frontend CloudFormation
        run: |
          aws cloudformation deploy \
            --region ap-southeast-2 \
            --stack-name afl-app-dev-frontend \
            --template-file infrastructure/app/frontend.yaml \
            --role-arn arn:aws:iam::134387458447:role/afl-video-cfn-execution-role \
            --no-fail-on-empty-changeset
      - name: Get frontend outputs
        id: outputs
        shell: bash
        run: |
          get_output() {
            aws cloudformation describe-stacks --region ap-southeast-2 \
              --stack-name afl-app-dev-frontend \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" --output text
          }
          echo "bucket=$(get_output FrontendBucketName)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(get_output DistributionId)" >> "$GITHUB_OUTPUT"
          echo "url=$(get_output FrontendUrl)" >> "$GITHUB_OUTPUT"
      - name: Upload standalone HTML
        run: aws s3 cp frontend/index.html "s3://${{ steps.outputs.outputs.bucket }}/index.html" --content-type 'text/html; charset=utf-8' --cache-control 'max-age=60, must-revalidate'
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.outputs.outputs.distribution }}" --paths /index.html /
      - name: Print frontend URL
        run: echo "Open ${{ steps.outputs.outputs.url }}"
