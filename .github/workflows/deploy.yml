name: Deploy AFL development platform
on:
  push:
    branches: [deploy]
permissions:
  contents: read
  id-token: write
concurrency:
  group: afl-dev-deploy
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout full Git history for secret scan
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Block deployment on credential leaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
      - name: Install cfn-lint
        run: python -m pip install --disable-pip-version-check 'cfn-lint>=1,<2'
      - name: Validate CloudFormation
        run: cfn-lint infrastructure/bootstrap/bootstrap.yaml infrastructure/app/frontend.yaml infrastructure/app/backend.yaml --regions ap-southeast-2
      - name: Verify frontend and Python API
        run: |
          test -s frontend/index.html
          python3 -m py_compile src/api/handler.py src/api/video_prompts.py src/image_worker/handler.py src/video_worker/handler.py
          python3 -m json.tool scenarios/afl-grand-final-winning-kick/v1/video/config.json > /dev/null
          python3 -m json.tool scenarios/afl-grand-final-winning-kick/v1/config.json > /dev/null
      - name: Test browser polling and scene thumbnails
        run: node --test tests/test_frontend_poll.cjs
      - name: Test regional SigV4 presigned uploads
        run: |
          python -m pip install --disable-pip-version-check boto3
          python -m unittest discover -s tests -p 'test_*.py' -v
  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose GitHub OIDC claims (no token logged)
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import urllib.parse
          import urllib.request

          base_url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"]
          separator = "&" if "?" in base_url else "?"
          url = base_url + separator + urllib.parse.urlencode({"audience": "sts.amazonaws.com"})
          req = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"],
          })
          with urllib.request.urlopen(req) as response:
              jwt = json.load(response)["value"]
          payload = jwt.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          for claim in ("iss", "aud", "sub", "repository", "ref", "environment"):
              if claim in claims:
                  print(f"{claim}: {claims[claim]}")
          PY
      - name: Assume AFL deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
      - name: Verify caller
        run: aws sts get-caller-identity
      - name: Deploy frontend CloudFormation
        run: |
          aws cloudformation deploy \
            --region ap-southeast-2 \
            --stack-name afl-app-dev-frontend \
            --template-file infrastructure/app/frontend.yaml \
            --role-arn arn:aws:iam::134387458447:role/afl-video-cfn-execution-role \
            --no-fail-on-empty-changeset
      - name: Get frontend outputs
        id: outputs
        shell: bash
        run: |
          get_output() {
            aws cloudformation describe-stacks --region ap-southeast-2 \
              --stack-name afl-app-dev-frontend \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue | [0]" --output text
          }
          echo "bucket=$(get_output FrontendBucketName)" >> "$GITHUB_OUTPUT"
          echo "distribution=$(get_output DistributionId)" >> "$GITHUB_OUTPUT"
          echo "url=$(get_output FrontendUrl)" >> "$GITHUB_OUTPUT"
      - name: Package and upload API Lambda
        run: |
          mkdir -p dist/api
          cp src/api/handler.py src/api/video_prompts.py dist/api/
          (cd dist/api && zip -q ../api-$GITHUB_SHA.zip handler.py video_prompts.py)
          python3 - <<'PY'
          import zipfile, os
          with zipfile.ZipFile('dist/api-' + os.environ['GITHUB_SHA'] + '.zip') as archive:
              assert {'handler.py', 'video_prompts.py'} <= set(archive.namelist())
          PY
          aws s3 cp "dist/api-$GITHUB_SHA.zip" \
            "s3://afl-video-bootstrap-artifactbucket-xiuriidgyft4/api/$GITHUB_SHA.zip" \
            --region ap-southeast-2
      - name: Verify all three S3 scene masters exist
        run: |
          set -euo pipefail
          for scene in scene1 scene2 scene3; do
            aws s3api head-object \
              --region ap-southeast-2 \
              --bucket afl-video-bootstrap-artifactbucket-xiuriidgyft4 \
              --key "scenarios/afl-grand-final-winning-kick/v1/${scene}-start.png" > /dev/null
          done
      - name: Upload versioned scenario config and image worker
        run: |
          aws s3 cp scenarios/afl-grand-final-winning-kick/v1/config.json \
            s3://afl-video-bootstrap-artifactbucket-xiuriidgyft4/scenarios/afl-grand-final-winning-kick/v1/config.json \
            --content-type application/json --region ap-southeast-2
          mkdir -p dist/image-worker
          cp src/image_worker/handler.py dist/image-worker/handler.py
          (cd dist/image-worker && zip -q ../image-worker-$GITHUB_SHA.zip handler.py)
          aws s3 cp "dist/image-worker-$GITHUB_SHA.zip" \
            "s3://afl-video-bootstrap-artifactbucket-xiuriidgyft4/image-worker/$GITHUB_SHA.zip" \
            --region ap-southeast-2
      - name: Publish versioned video prompt configuration and templates to S3
        run: |
          set -euo pipefail
          bucket=afl-video-bootstrap-artifactbucket-xiuriidgyft4
          prefix=scenarios/afl-grand-final-winning-kick/v1/video
          aws s3 cp scenarios/afl-grand-final-winning-kick/v1/video/config.json \
            "s3://$bucket/$prefix/config.json" --content-type application/json --region ap-southeast-2
          for scene in scene1 scene2 scene3; do
            aws s3 cp "scenarios/afl-grand-final-winning-kick/v1/video/${scene}-video.txt" \
              "s3://$bucket/$prefix/${scene}-video.txt" --content-type text/plain --region ap-southeast-2
          done
      - name: Use Lambda-compatible Python 3.13 for dependency packaging
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Package Google-auth video worker (NO model calls)
        run: |
          mkdir -p dist/video-worker
          python3 -m pip install --disable-pip-version-check --no-cache-dir             --target dist/video-worker 'google-auth>=2.38,<3' 'requests>=2.31,<3'
          cp src/video_worker/handler.py dist/video-worker/handler.py
          # Smoke-test actual third-party dependencies as packaged. A py_compile
          # check alone cannot catch import errors during AWS Lambda cold start.
          GOOGLE_PROJECT_NUMBER=345956846110 \
          GOOGLE_WIF_POOL_ID=afl-video-aws \
          GOOGLE_WIF_PROVIDER_ID=afl-aws-dev \
          GOOGLE_SERVICE_ACCOUNT=afl-video-worker@afl-video-platform.iam.gserviceaccount.com \
          PYTHONPATH=dist/video-worker python3 -c 'import sys, handler; assert sys.version_info[:2] == (3, 13); assert callable(handler.lambda_handler); print("Python 3.13 video-worker imports OK")'
          (cd dist/video-worker && zip -q -r ../video-worker-$GITHUB_SHA.zip .)
          aws s3 cp "dist/video-worker-$GITHUB_SHA.zip"             "s3://afl-video-bootstrap-artifactbucket-xiuriidgyft4/video-worker/$GITHUB_SHA.zip"             --region ap-southeast-2
      - name: Deploy API and jobs CloudFormation
        run: |
          aws cloudformation deploy \
            --region ap-southeast-2 \
            --stack-name afl-app-dev-backend \
            --template-file infrastructure/app/backend.yaml \
            --parameter-overrides \
              ArtifactBucketName=afl-video-bootstrap-artifactbucket-xiuriidgyft4 \
              LambdaArtifactKey=api/$GITHUB_SHA.zip \
              ImageWorkerArtifactKey=image-worker/$GITHUB_SHA.zip \
              VideoWorkerArtifactKey=video-worker/$GITHUB_SHA.zip \
              ScenarioAssetsBucket=afl-video-bootstrap-artifactbucket-xiuriidgyft4 \
              ReplicateSecretName=afl-app/dev/replicate-api-token \
              "FrontendOrigin=${{ steps.outputs.outputs.url }}" \
              PermissionsBoundaryArn=arn:aws:iam::134387458447:policy/afl-video-app-permissions-boundary \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn arn:aws:iam::134387458447:role/afl-video-cfn-execution-role \
            --no-fail-on-empty-changeset
      - name: Get backend API endpoint
        id: backend
        shell: bash
        run: |
          API_URL=$(aws cloudformation describe-stacks \
            --region ap-southeast-2 \
            --stack-name afl-app-dev-backend \
            --query "Stacks[0].Outputs[?OutputKey=='ApiBaseUrl'].OutputValue | [0]" \
            --output text)
          test -n "$API_URL"
          echo "url=$API_URL" >> "$GITHUB_OUTPUT"
      - name: Verify browser CORS preflight for API Gateway and upload S3
        shell: bash
        run: |
          set -euo pipefail
          origin="${{ steps.outputs.outputs.url }}"
          api_url="${{ steps.backend.outputs.url }}"
          api_status=$(curl --silent --show-error --retry 2 --retry-delay 2 \
            --max-time 15 --output /tmp/afl-api-preflight-body \
            --dump-header /tmp/afl-api-preflight-headers \
            --write-out '%{http_code}' --request OPTIONS "$api_url/uploads" \
            --header "Origin: $origin" \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type,x-api-key')
          echo "API preflight HTTP $api_status"
          if [ "$api_status" != 200 ]; then
            cat /tmp/afl-api-preflight-headers
            cat /tmp/afl-api-preflight-body
            exit 1
          fi
          grep -Fiq "access-control-allow-origin: $origin" /tmp/afl-api-preflight-headers || {
            echo 'API Gateway preflight missing matching Access-Control-Allow-Origin'
            cat /tmp/afl-api-preflight-headers
            exit 1
          }
          bucket=$(aws cloudformation describe-stacks --region ap-southeast-2 \
            --stack-name afl-app-dev-backend \
            --query "Stacks[0].Outputs[?OutputKey=='UploadsBucketName'].OutputValue | [0]" \
            --output text)
          s3_status=$(curl --silent --show-error --retry 2 --retry-delay 2 \
            --max-time 15 --output /tmp/afl-s3-preflight-body \
            --dump-header /tmp/afl-s3-preflight-headers \
            --write-out '%{http_code}' --request OPTIONS \
            "https://$bucket.s3.ap-southeast-2.amazonaws.com/" \
            --header "Origin: $origin" \
            --header 'Access-Control-Request-Method: POST' \
            --header 'Access-Control-Request-Headers: content-type')
          echo "S3 preflight HTTP $s3_status"
          if [ "$s3_status" != 200 ]; then
            cat /tmp/afl-s3-preflight-headers
            cat /tmp/afl-s3-preflight-body
            exit 1
          fi
          grep -Fiq "access-control-allow-origin: $origin" /tmp/afl-s3-preflight-headers || {
            echo 'S3 preflight missing matching Access-Control-Allow-Origin'
            cat /tmp/afl-s3-preflight-headers
            exit 1
          }
      - name: Generate public frontend API configuration
        run: |
          printf 'window.AFL_CONFIG = {"apiBaseUrl":"%s"};\n' \
            "${{ steps.backend.outputs.url }}" > frontend/config.js
      - name: Upload frontend configuration
        run: |
          aws s3 cp frontend/config.js \
            "s3://${{ steps.outputs.outputs.bucket }}/config.js" \
            --content-type 'application/javascript; charset=utf-8' \
            --cache-control 'no-store'
      - name: Upload standalone HTML
        run: aws s3 cp frontend/index.html "s3://${{ steps.outputs.outputs.bucket }}/index.html" --content-type 'text/html; charset=utf-8' --cache-control 'max-age=60, must-revalidate'
      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${{ steps.outputs.outputs.distribution }}" --paths /index.html /config.js /
      - name: Print deployment endpoints
        run: |
          echo "Frontend: ${{ steps.outputs.outputs.url }}"
          echo "API: ${{ steps.backend.outputs.url }}"
