name: Validate guided AFL workflow UI
on:
  push:
    branches:
      - fix/stage4-guided-workflow-ui
permissions:
  contents: read
jobs:
  frontend-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run offline frontend tests
        run: node --test tests/test_frontend_poll.cjs
      - name: Verify Python API syntax
        run: python3 -m py_compile src/api/handler.py src/api/video_prompts.py
