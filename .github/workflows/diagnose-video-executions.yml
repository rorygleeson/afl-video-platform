name: Diagnose recent real video executions (read-only)
on:
  push:
    branches: [main]
    paths: ['.github/workflows/diagnose-video-executions.yml']
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::134387458447:role/afl-video-github-deploy-role
          aws-region: ap-southeast-2
      - name: Recent paid scene executions and status (no submissions)
        run: |
          set -euo pipefail
          aws stepfunctions list-executions --state-machine-arn arn:aws:states:ap-southeast-2:134387458447:stateMachine:afl-app-dev-google-omni --max-results 15 --output json > /tmp/executions.json
          python - <<'PY'
          import json
          data=json.load(open('/tmp/executions.json'))
          items=[x for x in data.get('executions',[]) if x.get('name','').startswith('real-')]
          print('RECENT_REAL_VIDEO_EXECUTION_COUNT:',len(items))
          for x in items[:12]:
              print('EXECUTION_STATUS:',x.get('status'), 'SCENE:',x.get('name','').rsplit('-',1)[-1], 'START:',str(x.get('startDate',''))[:22])
          print('Read-only. No Google POST and no Step Functions StartExecution.')
          PY
